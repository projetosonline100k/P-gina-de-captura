      function selectedComponentSettingsMarkup(quiz, stage = state.adminStage) {
        if (!state.selectedComponentId) return "";
        return `
          <div class="settings-tabs">
            <button type="button" class="active">Componente</button>
          </div>
          <div class="settings-scroll">
            <div class="settings-group">
              ${stageComponentsEditor(quiz, stage)}
            </div>
          </div>
        `;
      }

      function bindSelectedComponentSettings(root) {
        root.querySelector("[data-action='remove-stage-component']")?.addEventListener("click", (event) => {
          event.preventDefault();
          removeStageComponent(event.currentTarget.dataset.componentId);
        });
        root.querySelectorAll("[data-action='locate-stage-element']").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.preventDefault();
            locateStageElement(button.dataset.targetId);
          });
        });
        root.querySelectorAll("[data-stage-component]").forEach((input) => {
          input.addEventListener("input", () => {
            const component = stageComponentById(input.dataset.stageComponent);
            if (!component) return;
            if (applyFormattingToTextSelection(component.id, input.dataset.componentKey, input.value)) return;
            component[input.dataset.componentKey] = input.hasAttribute("data-component-boolean") ? input.checked : input.value;
            saveQuizzes();
            refreshAdminCanvas();
          });
          if (["destination", "progressMode"].includes(input.dataset.componentKey)) {
            input.addEventListener("change", () => render());
          }
        });
        root.querySelectorAll("[data-option-component]").forEach((input) => {
          input.addEventListener("input", () => updateComponentOption(
            input.dataset.optionComponent,
            Number(input.dataset.optionIndex),
            input.dataset.optionKey,
            input.value
          ));
        });
        root.querySelectorAll("[data-timer-target]").forEach((input) => {
          input.addEventListener("change", () => {
            const timer = stageComponentById(input.dataset.timerTarget);
            if (!timer) return;
            timer.targetIds ||= [];
            if (input.checked && !timer.targetIds.includes(input.value)) timer.targetIds.push(input.value);
            if (!input.checked) timer.targetIds = timer.targetIds.filter((id) => id !== input.value);
            const card = input.closest(".visibility-item");
            card?.classList.toggle("delayed", input.checked);
            card?.classList.toggle("immediate", !input.checked);
            const status = card?.querySelector("em");
            if (status) status.textContent = input.checked ? "Aparece após o timer" : "Aparece imediatamente";
            saveQuizzes();
          });
        });
        root.querySelectorAll("[data-locate-target]").forEach((card) => {
          card.addEventListener("mouseenter", () => locateStageElement(card.dataset.locateTarget, true));
          card.addEventListener("mouseleave", () => {
            document.querySelector(`[data-delay-target="${CSS.escape(card.dataset.locateTarget)}"]`)?.classList.remove("located-stage-element");
          });
        });
      }

      function rememberTextSelection(element) {
        const selection = window.getSelection();
        if (!selection?.rangeCount || selection.isCollapsed) return;
        const range = selection.getRangeAt(0);
        if (!element.contains(range.commonAncestorContainer)) return;
        savedTextRange = range.cloneRange();
        savedTextComponentId = element.dataset.inlineComponent;
      }

      function applyFormattingToTextSelection(componentId, key, value) {
        const styleProperty = {
          color: "color",
          fontFamily: "fontFamily",
          fontSize: "fontSize",
          fontWeight: "fontWeight",
          letterSpacing: "letterSpacing",
          lineHeight: "lineHeight"
        }[key];
        if (!styleProperty || savedTextComponentId !== componentId || !savedTextRange || savedTextRange.collapsed) return false;
        const text = document.querySelector(`.custom-text-content[data-inline-component="${CSS.escape(componentId)}"]`);
        if (!text || !text.contains(savedTextRange.commonAncestorContainer)) return false;
        const span = document.createElement("span");
        const formattedValue = key === "fontSize" || key === "letterSpacing" ? `${Number(value) || 0}px` : value;
        span.style[styleProperty] = formattedValue;
        try {
          const fragment = savedTextRange.extractContents();
          span.appendChild(fragment);
          savedTextRange.insertNode(span);
          savedTextRange.selectNodeContents(span);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(savedTextRange);
          const component = stageComponentById(componentId);
          if (component) {
            component.content = text.innerText;
            component.richHtml = sanitizeRichText(text.innerHTML);
            saveQuizzes();
          }
          savedTextRange = savedTextRange.cloneRange();
          return true;
        } catch (error) {
          savedTextRange = null;
          savedTextComponentId = null;
          return false;
        }
      }

      function selectStageComponent(id) {
        const component = stageComponentById(id);
        if (!component) return;
        state.selectedComponentId = id;
        state.selectedQuestionOptionIndex = null;
        document.querySelectorAll(".selected-custom-component").forEach((element) => element.classList.remove("selected-custom-component"));
        document.querySelector(`[data-component-id="${CSS.escape(id)}"]`)?.classList.add("selected-custom-component");
        const panel = document.querySelector(".settings-panel");
        if (!panel) return;
        panel.innerHTML = selectedComponentSettingsMarkup(activeQuiz(), state.adminStage);
        bindSelectedComponentSettings(panel);
      }

      function selectQuestionOption(questionIndex, optionIndex) {
        flushPendingComponentEdits();
        state.selectedComponentId = null;
        state.selectedQuestionOptionIndex = optionIndex;
        state.adminStage = questionIndex + 2;
        render();
        window.requestAnimationFrame(() => {
          const card = document.querySelector(`[data-option-card="${questionIndex}:${optionIndex}"]`);
          card?.scrollIntoView({ block: "center", behavior: "smooth" });
          card?.querySelector("[data-okey='text']")?.focus({ preventScroll: true });
        });
      }

      function locateStageElement(targetId, keepHighlight = false) {
        const frame = document.querySelector(".selected-outline");
        const target = frame?.querySelector(`[data-delay-target="${CSS.escape(targetId)}"]`);
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
        target.classList.add("located-stage-element");
        if (!keepHighlight) window.setTimeout(() => target.classList.remove("located-stage-element"), 1800);
      }

      function timerTargetOptions(quiz, stage) {
        return timerTargetDetails(quiz, stage).map((item) => [item.id, item.label]);
      }

      function timerTargetDetails(quiz, stage) {
        const key = stageKey(quiz, stage);
        const common = {
          intro: [
            { id: "intro-title", label: "Título", type: "Texto", preview: quiz.title },
            { id: "intro-image", label: "Imagem principal", type: "Imagem", preview: "Foto principal da abertura" },
            { id: "intro-subtitle", label: "Subtítulo", type: "Texto", preview: quiz.subtitle },
            { id: "intro-cta", label: "Botão de começar", type: "Botão", preview: "Começar o diagnóstico" },
            { id: "intro-trust", label: "Selos de segurança", type: "Selos", preview: "Site seguro · SSL · Google" }
          ],
          loading: [
            { id: "loading-title", label: "Título do carregamento", type: "Texto", preview: "Estamos calculando seu diagnóstico…" },
            { id: "loading-progress", label: "Barra de progresso", type: "Progresso", preview: "Carregamento de 0% a 100%" },
            { id: "loading-social", label: "Depoimentos", type: "Depoimentos", preview: "Relatos de Jaci e Davi" }
          ],
          result: [
            { id: "result-kicker", label: "Seu perfil", type: "Texto", preview: "Seu perfil" },
            { id: "result-title", label: "Título do resultado", type: "Título", preview: quiz.results[0]?.title || "Resultado" },
            { id: "result-diagnosis", label: "Diagnóstico", type: "Texto", preview: quiz.results[0]?.text || "Diagnóstico personalizado" },
            { id: "result-organization-title", label: "Precisa de organização", type: "Título", preview: "Mas você não precisa de mais dinheiro…" },
            { id: "result-copy", label: "Texto de venda", type: "Texto", preview: "Quem viaja com frequência não é quem ganha mais…" },
            { id: "result-benefits", label: "Benefícios", type: "Lista", preview: (quiz.results[0]?.bullets || []).join(" · ") },
            { id: "result-cta", label: "Botão principal", type: "Botão", preview: quiz.ctaLabel }
          ]
        };
        const base = key.startsWith("question:")
          ? [
              { id: "question-title", label: "Pergunta", type: "Título", preview: quiz.questions[Number(key.split(":")[1])]?.text || "Pergunta" },
              { id: "question-options", label: "Opções de resposta", type: "Opções", preview: (quiz.questions[Number(key.split(":")[1])]?.options || []).map((option) => option.text).join(" · ") }
            ]
          : (common[key] || []);
        const custom = (quiz.stageComponents?.[key] || [])
          .filter((item) => item.type !== "Timer")
          .map((item) => ({
            id: `component:${item.id}`,
            label: item.customName || item.title || item.type,
            type: item.type,
            preview: item.content || item.price || item.features || `${item.type} adicionado`,
            position: Math.max(0, Math.min(4, Number(item.position ?? 4)))
          }));
        const sequence = key === "intro"
          ? ["@0", "intro-title", "@1", "intro-image", "@2", "intro-subtitle", "@3", "intro-cta", "@4", "intro-trust"]
          : key === "loading"
            ? ["@0", "loading-title", "@1", "loading-progress", "@2", "loading-social", "@3", "@4"]
            : key === "result"
              ? ["@0", "result-kicker", "result-title", "@1", "result-diagnosis", "@2", "result-organization-title", "result-copy", "@3", "result-benefits", "@4", "result-cta"]
              : key.startsWith("question:")
                ? ["@0", "question-title", "@1", "@2", "question-options", "@3", "@4"]
                : [];
        const baseById = new Map(base.map((item) => [item.id, item]));
        const ordered = sequence.flatMap((token) => {
          if (token.startsWith("@")) {
            const position = Number(token.slice(1));
            return custom.filter((item) => item.position === position);
          }
          return baseById.has(token) ? [baseById.get(token)] : [];
        });
        const included = new Set(ordered.map((item) => item.id));
        return [...ordered, ...base.filter((item) => !included.has(item.id)), ...custom.filter((item) => !included.has(item.id))];
      }

      function timerTargetCards(quiz, stage, selected, timerId) {
        const icons = { Texto: "T", Título: "T", Imagem: "▧", Botão: "▭", Lista: "☷", Vídeo: "▶", Preço: "$", Opções: "☑", Progresso: "◒", Depoimentos: "❞", Selos: "✓" };
        const targets = timerTargetDetails(quiz, stage);
        if (!targets.length) return `<p class="settings-note">Adicione outro componente nesta etapa para controlá-lo.</p>`;
        return targets.map((item) => {
          const delayed = selected.includes(item.id);
          const preview = String(item.preview || "").replace(/\s+/g, " ").trim().slice(0, 88);
          return `
            <article class="visibility-item ${delayed ? "delayed" : "immediate"}" data-locate-target="${escapeAttr(item.id)}">
              <label>
                <input type="checkbox" value="${escapeAttr(item.id)}" ${delayed ? "checked" : ""} data-timer-target="${timerId}">
                <span class="visibility-icon">${icons[item.type] || "◆"}</span>
                <span class="visibility-copy">
                  <strong>${escapeHtml(item.label)}</strong>
                  <small>${escapeHtml(item.type)} · ${escapeHtml(preview || "Sem conteúdo")}</small>
                  <em>${delayed ? "Aparece após o timer" : "Aparece imediatamente"}</em>
                </span>
              </label>
              <button type="button" data-action="locate-stage-element" data-target-id="${escapeAttr(item.id)}">Localizar</button>
            </article>
          `;
        }).join("");
      }

      function timerComponentEditor(quiz, stage, component) {
        const selected = component.targetIds || [];
        return `
          <div class="timer-editor">
            <label class="field"><span>Atraso em segundos</span><input type="number" min="0" value="${Math.max(0, Number(component.content) || 0)}" data-stage-component="${component.id}" data-component-key="content"></label>
            <p class="timer-behavior-note">Os elementos marcados começam escondidos e aparecem quando o tempo terminar. O relógio não aparece para o usuário.</p>
            <strong class="timer-target-title">Elementos afetados</strong>
            <div class="timer-target-list">
              ${timerTargetCards(quiz, stage, selected, component.id)}
            </div>
          </div>
        `;
      }

      function inlineTimerEditor(component) {
        const selected = component.targetIds || [];
        return `
          <div class="inline-timer-editor">
            <div class="inline-timer-head single-field">
              <label>Tempo em segundos<input type="number" min="0" value="${Math.max(0, Number(component.content) || 0)}" data-inline-component="${component.id}" data-component-key="content"></label>
            </div>
            <p class="timer-behavior-note">Os itens marcados começam escondidos e aparecem após esse tempo. O relógio fica invisível para o usuário.</p>
            <strong>O que este Timer controla?</strong>
            <div class="inline-timer-targets">
              ${timerTargetCards(activeQuiz(), state.adminStage, selected, component.id)}
            </div>
          </div>
        `;
      }

      function stageComponentsView(quiz, key, preview, position = 4) {
        const allComponents = quiz.stageComponents?.[key] || [];
        const mobileMode = preview ? state.previewDevice === "mobile" : window.matchMedia("(max-width: 680px)").matches;
        const components = allComponents
          .filter((component) => Number(mobileMode ? (component.mobilePosition ?? component.position ?? 4) : (component.position ?? 4)) === position)
          .sort((a, b) => mobileMode ? Number(a.mobileOrder ?? allComponents.indexOf(a)) - Number(b.mobileOrder ?? allComponents.indexOf(b)) : allComponents.indexOf(a) - allComponents.indexOf(b));
        if (!components.length && !preview) return "";
        const dropData = preview ? ` data-component-position="${position}"` : "";
        return `<div class="custom-components ${components.length ? "" : "empty-component-position"}"${dropData}>${components.map((component) => componentView(component, preview, key, quiz)).join("")}</div>`;
      }

      function priceEditable(component, key, preview, className = "", fallback = "") {
        const value = component[key] || fallback;
        return `<span class="${className}" contenteditable="${preview ? "true" : "false"}" data-inline-component="${component.id}" data-component-key="${key}">${escapeHtml(value)}</span>`;
      }

      function componentFontFamily(value) {
        const fonts = {
          "Inter": "Inter, sans-serif",
          "Playfair Display": "Playfair Display, Georgia, serif",
          "Georgia": "Georgia, serif",
          "Arial": "Arial, sans-serif",
          "system-ui": "system-ui, sans-serif"
        };
        return fonts[value] || fonts.Inter;
      }

      function numericPrice(value) {
        const clean = String(value || "").replace(/[^\d,.-]/g, "");
        if (!clean) return Number.POSITIVE_INFINITY;
        const normalized = clean.includes(",")
          ? clean.replace(/\./g, "").replace(",", ".")
          : clean;
        const number = Number.parseFloat(normalized);
        return Number.isFinite(number) ? number : Number.POSITIVE_INFINITY;
      }

      function progressInfoFor(quiz, key) {
        const stages = ["intro", "name", ...quiz.questions.map((_, index) => `question:${index}`), "loading", "result"]
          .filter((stage) => !(quiz.removedStages || []).includes(stage));
        const index = Math.max(0, stages.indexOf(key));
        const labels = { intro: "Início", name: "Identificação", loading: "Preparando resultado", result: "Resultado" };
        return {
          current: index + 1,
          total: Math.max(1, stages.length),
          percent: Math.round(((index + 1) / Math.max(1, stages.length)) * 100),
          label: labels[key] || (key.startsWith("question:") ? `Pergunta ${Number(key.split(":")[1]) + 1}` : "Etapa atual")
        };
      }

      function progressComponentMarkup(component, info) {
        const color = escapeAttr(component.color || "#6438e8");
        const style = `--progress-color:${color};--progress-percent:${info.percent}%`;
        const meta = `${component.showCount !== false ? `<span>${String(info.current).padStart(2, "0")} / ${String(info.total).padStart(2, "0")}</span>` : ""}${component.showPercent !== false ? `<b>${info.percent}%</b>` : ""}`;
        if (component.template === "segmented") {
          return `<div class="custom-progress progress-segmented" style="${style}"><div>${Array.from({ length: info.total }).map((_, index) => `<i class="${index < info.current ? "done" : ""}"></i>`).join("")}</div><footer>${meta}</footer></div>`;
        }
        if (["numbered", "icons"].includes(component.template)) {
          return `<div class="custom-progress progress-steps progress-${escapeAttr(component.template)}" style="${style}"><div>${Array.from({ length: info.total }).map((_, index) => `<i class="${index < info.current ? "done" : ""}">${component.template === "icons" ? ["●", "▣", "✓", "⚑"][Math.min(3, Math.floor(index * 4 / info.total))] : index + 1}</i>`).join("")}</div><strong>${escapeHtml(info.label)}</strong></div>`;
        }
        const marker = component.template === "marker" ? `<i></i>` : "";
        const centered = component.template === "centered" && component.showPercent !== false ? `<strong>${info.percent}%</strong>` : "";
        return `<div class="custom-progress progress-bar-style progress-${escapeAttr(component.template || "minimal")}" style="${style}">${centered}<div><span></span>${marker}</div><footer>${meta}</footer></div>`;
      }

      function resolvedProgressInfo(component, automaticInfo) {
        if (component.progressMode !== "manual") return automaticInfo;
        const total = Math.max(1, Math.min(50, Number(component.manualTotal) || 1));
        const current = Math.max(1, Math.min(total, Number(component.manualCurrent) || 1));
        return {
          current,
          total,
          percent: Math.round((current / total) * 100),
          label: String(component.manualLabel || "Etapa atual")
        };
      }

      function priceCardMarkup(component, preview, compact = false) {
        const template = component.template || "simple";
        const editable = (key, className = "", fallback = "") => priceEditable(component, key, preview, className, fallback);
        if (template === "comparison") {
          const linkPreview = preview || compact;
          const plans = [
            {
              featured: false,
              nameKey: "title",
              priceKey: "price",
              billingKey: "basicBillingPeriod",
              featuresKey: "basicFeatures",
              buttonLabelKey: "basicButtonLabel",
              buttonUrl: component.basicButtonUrl,
              checkoutKey: "basicCountsAsCheckout",
              buttonFallback: "Escolher Básico"
            },
            {
              featured: true,
              nameKey: "oldPrice",
              priceKey: "suffix",
              billingKey: "premiumBillingPeriod",
              featuresKey: "premiumFeatures",
              buttonLabelKey: "premiumButtonLabel",
              buttonUrl: component.premiumButtonUrl,
              checkoutKey: "premiumCountsAsCheckout",
              buttonFallback: "Escolher Premium"
            }
          ].sort((a, b) => numericPrice(component[a.priceKey]) - numericPrice(component[b.priceKey]));
          return `
            <div class="price-card price-card-comparison ${compact ? "compact" : ""}">
              ${plans.map((plan) => `
                <div class="price-plan ${plan.featured ? "featured" : ""}">
                  ${editable(plan.nameKey, "price-plan-name")}
                  ${editable(plan.priceKey, "price-plan-value")}
                  ${editable(plan.billingKey, "price-billing-period", "/mês")}
                  <div class="price-feature-copy" contenteditable="${preview ? "true" : "false"}" data-inline-component="${component.id}" data-component-key="${plan.featuresKey}">${escapeHtml(component[plan.featuresKey] || component.features || "")}</div>
                  <a class="price-plan-button ${plan.featured ? "premium" : ""}" href="${escapeAttr(plan.buttonUrl || "#")}" ${linkPreview ? `data-action="preview-price-link"` : `${component[plan.checkoutKey] ? `data-action="checkout-click" ` : ""}target="_blank" rel="noopener"`}>${editable(plan.buttonLabelKey, "price-plan-button-label", plan.buttonFallback)}</a>
                </div>
              `).join("")}
            </div>
          `;
        }
        return `
          <div class="price-card price-card-${escapeAttr(template)} ${compact ? "compact" : ""}">
            ${component.badge || preview ? editable("badge", "price-badge") : ""}
            ${component.oldPrice || preview ? editable("oldPrice", "price-old") : ""}
            ${editable("title", "price-title")}
            ${editable("price", "price-value")}
            ${editable("suffix", "price-suffix")}
            <span class="price-accent"></span>
          </div>
        `;
      }

      function componentView(component, preview, componentStageKey = "", componentQuiz = activeQuiz()) {
        const selected = preview && state.selectedComponentId === component.id ? " selected-custom-component" : "";
        const selectAttr = preview ? ` data-action="select-custom-component" data-component-id="${component.id}"` : "";
        const dragAttr = preview ? ` draggable="true" data-custom-draggable="${component.id}"` : "";
        const toolbar = preview ? `
          <div class="canvas-component-toolbar" contenteditable="false">
            <span class="drag-handle" title="Arraste para mover">⠿</span>

          </div>` : "";
        const targetAttr = ` data-delay-target="component:${component.id}"`;
        if (component.type === "Progresso") {

        }

          return `<div class="custom-component timer-component${selected}"${selectAttr}${dragAttr}${targetAttr}>${toolbar}<div class="timer-summary"><span>⏱</span><strong data-timer-display="${component.id}">${seconds}s</strong><small>${component.action === "hide" ? "até ocultar" : "até liberar"}</small></div>${directEditor}</div>`;
        }

          else if (value) player = `<iframe srcdoc="${escapeAttr(value)}" title="Vídeo" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
          const inlineEditor = preview && state.selectedComponentId === component.id ? `<div class="inline-video-editor"><label>Link ou código da Vturb</label><textarea data-inline-component="${component.id}" data-component-key="content" placeholder="Cole aqui o link ou embed da Vturb">${escapeHtml(value)}</textarea><div class="inline-video-options"><label>Formato<select data-inline-component="${component.id}" data-component-key="aspectRatio"><option value="16:9" ${component.aspectRatio !== "9:16" ? "selected" : ""}>Horizontal 16:9</option><option value="9:16" ${component.aspectRatio === "9:16" ? "selected" : ""}>Reels 9:16</option></select></label><label>Posição<select data-inline-component="${component.id}" data-component-key="position">${["Topo", "Após o título", "Após o diagnóstico", "Após o texto", "Antes do botão"].map((label, index) => `<option value="${index}" ${Number(component.position ?? 4) === index ? "selected" : ""}>${label}</option>`).join("")}</select></label></div></div>` : "";
          const ratioClass = component.aspectRatio === "9:16" ? " video-reels" : "";
          return `<div class="custom-component video-component${ratioClass}${selected}"${selectAttr}${dragAttr}${targetAttr}>${toolbar}${player}${inlineEditor}</div>`;
        }
        if (component.type === "Preço") return `<div class="custom-component price-component${selected}"${selectAttr}${dragAttr}${targetAttr}>${toolbar}${priceCardMarkup(component, preview)}</div>`;
        if (component.type === "Texto") {
          const mobileMode = preview && state.previewDevice === "mobile";
          const current = (key, fallback) => mobileMode ? (component[`mobile${key.charAt(0).toUpperCase()}${key.slice(1)}`] ?? component[key] ?? fallback) : (component[key] ?? fallback);
          const mobile = (key, fallback) => component[`mobile${key.charAt(0).toUpperCase()}${key.slice(1)}`] ?? component[key] ?? fallback;
          const fontSize = Math.max(10, Math.min(120, Number(current("fontSize", 28))));
          const weight = ["400", "500", "600", "700", "800", "900"].includes(String(current("fontWeight", "600"))) ? current("fontWeight", "600") : "600";
          const align = ["left", "center", "right", "justify"].includes(current("textAlign", "center")) ? current("textAlign", "center") : "center";
          const tag = ["h1", "h2", "h3", "p", "blockquote", "span", "div"].includes(component.tag) ? component.tag : "p";
          const lineHeight = Math.max(0.8, Math.min(3, Number(component.lineHeight) || 1.25));
          const letterSpacing = Math.max(-5, Math.min(20, Number(component.letterSpacing) || 0));

          const marginBottom = Math.max(0, Math.min(200, Number(component.marginBottom) || 0));
          const maxWidth = Math.max(20, Math.min(100, Number(component.maxWidth) || 100));
          const accentClass = component.accent ? " text-accent" : "";
          const textContent = component.richHtml ? sanitizeRichText(component.richHtml) : escapeHtml(component.content || "Digite seu texto");
          const responsiveStyle = `--mobile-text-font:${escapeAttr(componentFontFamily(mobile("fontFamily", "Inter")))};--mobile-text-size:${Math.max(10, Math.min(120, Number(mobile("fontSize", 28))))}px;--mobile-text-weight:${escapeAttr(mobile("fontWeight", "600"))};--mobile-text-align:${escapeAttr(mobile("textAlign", "center"))};--mobile-text-color:${escapeAttr(mobile("color", "#172033"))}`;
          return `<div class="custom-component text-component${accentClass}${selected}" style="margin-top:${marginTop}px;margin-bottom:${marginBottom}px"${selectAttr}${dragAttr}${targetAttr}>${toolbar}<${tag} class="custom-text-content" style="font-family:${escapeAttr(componentFontFamily(current("fontFamily", "Inter")))};font-size:${fontSize}px;font-weight:${weight};text-align:${align};color:${escapeAttr(current("color", "#172033"))};line-height:${lineHeight};letter-spacing:${letterSpacing}px;max-width:${maxWidth}%;${responsiveStyle}" contenteditable="${preview ? "true" : "false"}" data-inline-component="${component.id}" data-component-key="content">${textContent}</${tag}></div>`;

        if (component.type === "Captura") {

            component.captureEmail !== false ? { key: "email", type: "email", label: component.emailLabel || "E-mail", required: component.requireEmail !== false, autocomplete: "email" } : null,
            component.captureWhatsapp !== false ? { key: "phone", type: "tel", label: component.whatsappLabel || "WhatsApp", required: component.requireWhatsapp === true, autocomplete: "tel" } : null
          ].filter(Boolean);
          return `<div class="custom-component capture-component${selected}"${selectAttr}${dragAttr}${targetAttr}>${toolbar}<form class="capture-form" data-capture-form="${component.id}" data-flow-stage-key="${escapeAttr(componentStageKey)}"><h3>${escapeHtml(component.content || "Preencha seus dados")}</h3>${fields.map((field) => `<label><span>${escapeHtml(field.label)}${field.required ? " *" : ""}</span><input type="${field.type}" name="${field.key}" value="${escapeAttr(state.lead[field.key] || "")}" autocomplete="${field.autocomplete}" ${field.required ? "required" : ""} data-capture-field="${field.key}" placeholder="Digite ${escapeAttr(field.label.toLowerCase())}"></label>`).join("")}${fields.length ? `<button type="submit">${escapeHtml(component.submitLabel || "Continuar")}</button>` : `<p class="capture-empty">Selecione pelo menos um dado nas configurações.</p>`}</form></div>`;
        }
        if (component.type === "Opções") {
          const options = Array.isArray(component.options) ? component.options : [];
          const icons = Array.isArray(component.icons) ? component.icons : [];
          const layout = component.template || "simple";
          const connectedTarget = flowConnectionFor(componentQuiz, componentStageKey, null)?.to || "";
          const optionAction = !preview && connectedTarget ? ` data-action="custom-button-go" data-destination="${escapeAttr(connectedTarget)}"` : "";
          return `<div class="custom-component options-component${selected}"${selectAttr}${dragAttr}${targetAttr}>${toolbar}<div class="custom-options-list layout-${escapeAttr(layout)}">${options.map((option, index) => `<button type="button"${optionAction}><i>${escapeHtml(icons[index] || "○")}</i><span>${escapeHtml(option)}</span><b>→</b></button>`).join("")}</div></div>`;
        }
        if (component.type === "Botão") {
          const connectedTarget = flowConnectionFor(componentQuiz, componentStageKey, null)?.to || "";
          const destination = component.destination || "url";
          const effectiveDestination = connectedTarget || destination;
          const isInternal = Boolean(connectedTarget) || effectiveDestination !== "url";
          const action = preview ? "" : isInternal ? ` data-action="custom-button-go" data-destination="${escapeAttr(effectiveDestination)}"` : component.countsAsCheckout ? ` data-action="checkout-click"` : "";
          const linkBehavior = !preview && !isInternal ? ` target="_blank" rel="noopener"` : "";
          const mobileMode = preview && state.previewDevice === "mobile";
          const current = (key, fallback) => mobileMode ? (component[`mobile${key.charAt(0).toUpperCase()}${key.slice(1)}`] ?? component[key] ?? fallback) : (component[key] ?? fallback);
          const mobile = (key, fallback) => component[`mobile${key.charAt(0).toUpperCase()}${key.slice(1)}`] ?? component[key] ?? fallback;
          const fontSize = Math.max(12, Math.min(60, Number(current("fontSize", 22))));
          const radius = Math.max(0, Math.min(60, Number(current("borderRadius", 14))));
          const width = Math.max(20, Math.min(100, Number(current("buttonWidth", 100))));
          const align = ["left", "center", "right"].includes(current("buttonAlign", "center")) ? current("buttonAlign", "center") : "center";
          const margin = align === "left" ? "0 auto 0 0" : align === "right" ? "0 0 0 auto" : "0 auto";
          const effect = ["none", "shadow", "glow", "pulse", "lift"].includes(current("effect", "shadow")) ? current("effect", "shadow") : "shadow";

        return `<div class="custom-component generic-component${selected}"${selectAttr}${dragAttr}${targetAttr}>${toolbar}<strong>${escapeHtml(component.type)}</strong><p contenteditable="${preview ? "true" : "false"}" data-inline-component="${component.id}" data-component-key="content">${escapeHtml(component.content || "Clique para editar")}</p></div>`;
      }

      function quizSubmissions(quiz) {
        return state.submissions.filter((item) => item.quizId === quiz.id && !isTestName(item.travelerName));
      }

      function quizFunnelRecords(quiz) {
        const records = state.funnel.filter((item) => item.quizId === quiz.id);
        const journeyRecords = records.filter((item) => item.stage !== "checkout-click");
        const resultRank = quiz.questions.length + 4;
        const completedTracked = journeyRecords.filter((item) => Number(item.maxRank || 0) >= resultRank).length;
        const submissions = quizSubmissions(quiz);
        const missingCompleted = Math.max(0, submissions.length - completedTracked);
        const missingSubmissions = missingCompleted ? submissions.slice(-missingCompleted) : [];
        return records.concat(missingSubmissions.map((submission, index) => ({
          sessionId: `resposta-antiga-${submission.id || index}`,
          quizId: quiz.id,
          createdAt: submission.createdAt,
          updatedAt: submission.createdAt,
          maxRank: resultRank,
          stage: "result"
        })));
      }

      function flowView(quiz) {

        const visitorRecords = funnelRecords.filter((item) => item.stage !== "checkout-click");
        const visitors = visitorRecords.length;

        return `

      function filterByFlowDate(items) {
        if (!state.flowDateFrom && !state.flowDateTo) return items;
        const from = state.flowDateFrom ? new Date(`${state.flowDateFrom}T00:00:00`).getTime() : -Infinity;
        const to = state.flowDateTo ? new Date(`${state.flowDateTo}T23:59:59.999`).getTime() : Infinity;
        return items.filter((item) => {
          const timestampSource = item.sessionId ? (item.updatedAt || item.createdAt) : item.createdAt;
          const timestamp = new Date(timestampSource || 0).getTime();
          return timestamp >= from && timestamp <= to;
        });
      }

      function localDateValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function setFlowDatePreset(preset) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        state.flowDatePreset = preset;
        if (preset === "all") {
          state.flowDateFrom = "";
          state.flowDateTo = "";
          return;
        }
        const end = new Date(today);
        const start = new Date(today);
        if (preset === "yesterday") {
          start.setDate(start.getDate() - 1);
          end.setDate(end.getDate() - 1);
        } else {
          const days = preset === "today" ? 1 : Math.max(1, Number(preset) || 1);
          start.setDate(start.getDate() - (days - 1));
        }
        state.flowDateFrom = localDateValue(start);
        state.flowDateTo = localDateValue(end);
      }

      function flowPeriodLabel() {
        if (!state.flowDateFrom && !state.flowDateTo) return "Todos os dados";
        const format = (value) => value ? new Intl.DateTimeFormat("pt-BR").format(new Date(`${value}T12:00:00`)) : "";
        if (state.flowDateFrom === state.flowDateTo) return format(state.flowDateFrom);
        return `${format(state.flowDateFrom) || "início"} até ${format(state.flowDateTo) || "hoje"}`;
      }

              id: component.id,
              stage,
              label: component.content || "Botão sem nome",
              url: component.url || "#",
              selected: Boolean(component.countsAsCheckout)
            }];
            if (component.type === "Preço" && component.template === "comparison") return [
              {
                id: `price:${component.id}:basic`,
                stage,
                label: component.basicButtonLabel || "Escolher Básico",
                url: component.basicButtonUrl || "#",
                selected: Boolean(component.basicCountsAsCheckout)
              },
              {
                id: `price:${component.id}:premium`,
                stage,
                label: component.premiumButtonLabel || "Escolher Premium",
                url: component.premiumButtonUrl || "#",
                selected: Boolean(component.premiumCountsAsCheckout)
              }
            ];
            return [];
          })
        );
        return [{
          id: "result-cta",
          stage: "Resultado",
          label: quiz.ctaLabel || "Botão principal",
          url: quiz.purchaseUrl || "#",
          selected: quiz.trackPrimaryCheckout !== false
        }, ...custom];
      }

      function metricCard(label, value) {

      function funnelView(quiz, records) {
        const steps = funnelSteps(quiz);
        const clickEvents = records.filter((item) => item.stage === "checkout-click");
        const journeyRecords = records.filter((item) => item.stage !== "checkout-click");
        const visitorCount = journeyRecords.filter((item) => Number(item.maxRank || 0) >= 0).length;
        const total = visitorCount || 1;
        const resultRank = quiz.questions.length + 4;
        const checkoutRank = quiz.questions.length + 5;
        const resultCount = journeyRecords.filter((item) => Number(item.maxRank || 0) >= resultRank).length;
        const checkoutVisitors = journeyRecords.filter((item) => Number(item.maxRank || 0) >= checkoutRank).length;
        const sessionsWithEvents = new Set(clickEvents.map((item) => item.sessionId.split(":checkout-click:")[0]));
        const legacyCheckoutVisitors = journeyRecords.filter((item) =>
          Number(item.maxRank || 0) >= checkoutRank && !sessionsWithEvents.has(item.sessionId)
        ).length;
        const checkoutClicks = clickEvents.length + legacyCheckoutVisitors;
        const checkoutConversion = Math.round((checkoutVisitors / total) * 100);
        const resultToCheckout = resultCount ? Math.round((checkoutVisitors / resultCount) * 100) : 0;
        return `
          <article class="funnel-panel">
            <div class="funnel-head">
              <div>
                <p class="admin-kicker">Funil</p>
                <h2>Passagem por etapa</h2>
              </div>
              <strong>${visitorCount} visitante(s)</strong>
            </div>
            <div class="funnel-summary">
              <div><span>Cliques no checkout</span><strong>${checkoutClicks}</strong></div>
              <div><span>Conversão total</span><strong>${checkoutConversion}%</strong></div>
              <div><span>Resultado → checkout</span><strong>${resultToCheckout}%</strong></div>
            </div>
            <div class="funnel-chart">
              ${steps.map((step, index) => {
                const count = journeyRecords.filter((item) => Number(item.maxRank || 0) >= step.rank).length;
                const previous = index === 0 ? count : journeyRecords.filter((item) => Number(item.maxRank || 0) >= steps[index - 1].rank).length;
                const percent = Math.round((count / total) * 100);
                const drop = Math.max(0, previous - count);
                const displayedCount = step.key === "checkout" ? checkoutClicks : count;
                return `
                  <div class="funnel-step" style="--pct:${percent}">
                    <span>${escapeHtml(step.label)}</span>
                    <b>${percent}%</b>
                    <strong>${displayedCount}</strong>
                    <small>${drop ? `-${drop} queda` : "sem queda"}</small>
                    <i></i>
                    ${step.key === "checkout" ? `<button class="select-checkout-buttons" type="button" data-action="toggle-checkout-picker">Selecionar botões</button>` : ""}
                  </div>
                `;
              }).join("")}
            </div>
            ${checkoutPickerMarkup(quiz)}
            ${visitorCount ? "" : `<p class="funnel-empty-note">Nenhum dado neste período. O gráfico continua visível para facilitar a comparação.</p>`}
          </article>
        `;
      }

      function questionFlowCard(question, qIndex, submissions) {
        const total = submissions.length || 0;
        return `

            <div class="flow-card-head">

                return `
                  <div class="flow-option">
                    <div><strong>${escapeHtml(option.text)}</strong><small>${count} resposta(s) · ${percent}%</small></div>
                    <span><i style="width:${percent}%"></i></span>
                  </div>
                `;
              }).join("")}
            </div>
          </article>
        `;
      }

      function latestSubmissionsTable(quiz, submissions) {
        if (!submissions.length) {
          return `<div class="empty-state">Ainda não tem respostas. Abra o link público, complete o quiz e volte aqui para ver o fluxo.</div>`;

        return `

                <span>${submission.answers.map((answer, index) => escapeHtml(quiz.questions[index]?.options[answer]?.text || "-")).join("<br>")}</span>
              </div>
            `).join("")}
          </div>
        `;
      }

      function profileBars(quiz, submissions) {
        if (!submissions.length) return `<div class="empty-state">Sem dados por enquanto.</div>`;
        const counts = countBy(submissions, "resultProfile");
        return Object.entries(counts).map(([profile, count]) => {
          const percent = Math.round((count / submissions.length) * 100);
          return `
            <div class="profile-bar">
              <div><strong>${escapeHtml(profileLabel(quiz, profile))}</strong><span>${count} · ${percent}%</span></div>
              <em><i style="width:${percent}%"></i></em>
            </div>
          `;
        }).join("");
      }

      function countBy(items, key) {
        return items.reduce((acc, item) => {
          const value = item[key] || "sem-perfil";
          acc[value] = (acc[value] || 0) + 1;
          return acc;
        }, {});
      }

      function profileLabel(quiz, profile) {
        return quiz.results.find((result) => result.profile === profile)?.title || profile;

              ${[["simple", "Lista simples"], ["icons", "Lista com emojis"], ["large", "Botões grandes"], ["grid", "Grade em 2 colunas"], ["cards", "Cards visuais"], ["yes-no", "Sim / Não"], ["ranking", "Ranking"]].map(([value, label]) => `<option value="${value}" ${(question.optionTemplate || "simple") === value ? "selected" : ""}>${label}</option>`).join("")}

            <div class="option-list">

      let loadingTimer = null;

      function activeExperienceKey(quiz) {
        if (state.flowStage === "quiz") return `question:${Math.min(state.previewStep, quiz.questions.length - 1)}`;

      function startVisibilityDelays(quiz) {
        delayTimerHandles.forEach((handle) => window.clearTimeout(handle));
        delayTimerHandles = [];
        const key = activeExperienceKey(quiz);
        const timers = (quiz.stageComponents?.[key] || []).filter((item) => item.type === "Timer");
        timers.forEach((timer) => {
          const totalMs = Math.max(0, Number(timer.content) || 0) * 1000;
          const runKey = `${quiz.id}:${key}:${timer.id}`;
          if (!delayStartedAt.has(runKey)) delayStartedAt.set(runKey, Date.now());
          const elapsed = Date.now() - delayStartedAt.get(runKey);
          const remaining = Math.max(0, totalMs - elapsed);
          const targets = timer.targetIds || [];
          targets.forEach((targetId) => {
            document.querySelectorAll(`[data-delay-target="${CSS.escape(targetId)}"]`).forEach((element) => {
              element.classList.toggle("delay-hidden", timer.action !== "hide" && remaining > 0);
              if (timer.action === "hide" && remaining <= 0) element.classList.add("delay-hidden");
            });
          });
          const timerElement = document.querySelector(`[data-timer-display="${CSS.escape(timer.id)}"]`);
          const timerBox = timerElement?.closest(".timer-component");
          if (timer.showCountdown === false && timerBox) timerBox.classList.add("delay-timer-invisible");
          const updateCountdown = () => {
            const left = Math.max(0, totalMs - (Date.now() - delayStartedAt.get(runKey)));
            if (timerElement) timerElement.textContent = `${Math.ceil(left / 1000)}s`;
            if (left > 0) delayTimerHandles.push(window.setTimeout(updateCountdown, 250));
          };
          updateCountdown();
          if (remaining > 0) {
            delayTimerHandles.push(window.setTimeout(() => {
              targets.forEach((targetId) => document.querySelectorAll(`[data-delay-target="${CSS.escape(targetId)}"]`).forEach((element) => {
                element.classList.toggle("delay-hidden", timer.action === "hide");
              }));
            }, remaining));
          }
        });
      }

      function personalizedQuestion(text, preview, step) {
        const firstName = String(state.lead.name || "").trim().split(/\s+/)[0];
        // O nome funciona como uma saudação na primeira pergunta; repeti-lo em
        // todas as etapas torna a leitura cansativa para quem responde o quiz.
        if (preview || !firstName || step !== 0) return text;
        const escapedName = firstName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const questionWithoutRepeatedName = String(text || "")
          .trim()
          .replace(new RegExp(`^(?:${escapedName}\\s*,\\s*)+`, "i"), "");
        return `${firstName}, ${lowerFirst(questionWithoutRepeatedName)}`;
      }

      function lowerFirst(text) {
        const value = String(text || "");
        return value.charAt(0).toLocaleLowerCase("pt-BR") + value.slice(1);

      function bindEvents(quiz) {
        const publicQuiz = getPublicQuiz();
        const isPublicPage = publicQuiz && !adminRoute();
        if (isPublicPage && state.flowStage === "loading") startLoading();
        if (isPublicPage) startVisibilityDelays(quiz);
        document.querySelectorAll("[data-action]").forEach((element) => {
          element.addEventListener("click", (event) => {
            const action = element.dataset.action;
            if (action) event.preventDefault();
            if (action === "logout-admin") {
              logoutAdmin();
              return;
            }
            if (adminRoute() && element.closest(".canvas-preview, .funnel-page-preview") && action?.startsWith("preview-")) return;
            if (action === "add-quiz") {
              state.quizNameDialog = { mode: "create" };
              state.quizNameDraft = "";
              render();
            }
            if (action === "rename-library-quiz") {
              const targetQuiz = state.quizzes.find((item) => item.id === element.dataset.id);
              if (targetQuiz) {
                state.quizNameDialog = { mode: "rename", id: targetQuiz.id };
                state.quizNameDraft = targetQuiz.title;
                render();
              }
            }
            if (action === "cancel-quiz-name") {
              state.quizNameDialog = null;
              state.quizNameDraft = "";
              render();
            }
            if (action === "confirm-quiz-name") {
              const name = state.quizNameDraft.trim();
              if (!name) {
                document.querySelector("[data-quiz-name-input]")?.focus();
                return;
              }
              if (state.quizNameDialog?.mode === "rename") {
                const targetQuiz = state.quizzes.find((item) => item.id === state.quizNameDialog.id);
                if (targetQuiz) {
                  state.activeId = targetQuiz.id;
                  targetQuiz.title = name;
                  targetQuiz.updatedAt = new Date().toISOString();
                  saveQuizzes();
                  state.adminTab = "home";
                }
                state.quizNameDialog = null;
                state.quizNameDraft = "";
                render();
              } else {
                state.quizNameDialog = null;
                state.quizNameDraft = "";
                addQuiz(name);
              }
            }
            if (action === "undo-editor") undoEditor();
            if (action === "redo-editor") redoEditor();
            if (action === "select-admin-tab") {
              state.adminTab = element.dataset.tab || "home";
              render();
              if (state.adminTab === "flow") refreshRemoteFunnel();
            }
            if (action === "filter-home-quizzes") {
              state.homeQuizFilter = element.dataset.filter || "all";
              render();
            }
            if (action === "edit-library-quiz") {
              state.activeId = element.dataset.id;
              state.adminTab = "builder";
              state.builderView = "flow";
              state.adminStage = 0;
              state.selectedComponentId = null;
              render();
            }
            if (action === "set-quiz-status") {
              const targetQuiz = state.quizzes.find((item) => item.id === element.dataset.id);
              if (targetQuiz) {
                targetQuiz.status = element.dataset.status || "active";
                targetQuiz.updatedAt = new Date().toISOString();
                state.activeId = targetQuiz.id;
                saveQuizzes();
                state.adminTab = "home";
                render();
              }
            }
            if (action === "select-builder-view") {
              state.builderView = element.dataset.builderView || "flow";
              render();
            }
            if (action === "map-zoom-in") {
              state.mapZoom = Math.min(1.5, state.mapZoom + 0.1);
              render();
            }
            if (action === "map-zoom-out") {
              state.mapZoom = Math.max(0.35, state.mapZoom - 0.1);
              render();
            }
            if (action === "map-zoom-reset") {
              state.mapZoom = 0.8;
              render();
            }
            if (action === "set-preview-device") {
              setPreviewDevice(element.dataset.device);
            }
            if (action === "toggle-stage-connection") {
              const key = stageKey(activeQuiz(), Number(element.dataset.stage));
              activeQuiz().flowDisconnected ||= [];
              activeQuiz().flowDisconnected = activeQuiz().flowDisconnected.includes(key)
                ? activeQuiz().flowDisconnected.filter((item) => item !== key)
                : [...activeQuiz().flowDisconnected, key];
              saveQuizzes();
              render();
            }
            if (action === "move-question-order") {
              moveQuestionOrder(Number(element.dataset.question), Number(element.dataset.direction));
            }
            if (action === "duplicate-question-page") {
              duplicateQuestionPage(Number(element.dataset.question));
            }
            if (action === "open-stage-editor") {
              state.adminStage = Number(element.dataset.stage || 0);
              state.builderView = "page";
              state.selectedComponentId = null;
              render();
            }
            if (action === "select-quiz") {
              state.activeId = element.dataset.id;
              state.adminStage = 0;
              state.flowStage = "intro";
              state.previewStep = 0;
              state.answers = [];
              render();
            }
            if (action === "duplicate-quiz") duplicateQuiz(element.dataset.id);
            if (action === "remove-quiz") {
              state.pendingDeleteQuizId = element.dataset.id;
              render();
            }
            if (action === "cancel-delete-quiz") {
              state.pendingDeleteQuizId = null;
              render();
            }
            if (action === "confirm-delete-quiz") {

            }
            if (action === "select-stage") {
              state.adminStage = Number(element.dataset.stage || 0);
              state.selectedComponentId = null;
              render();
            }
            if (action === "add-question") addQuestion();
            if (action === "add-manual-stage") {
              const targetQuiz = activeQuiz();
              const totalStages = targetQuiz.questions.length + 4;
              const nextStageIndex = Math.min(totalStages - 1, Number(targetQuiz.manualStageCount || 0));
              const nextStageKey = stageKey(targetQuiz, nextStageIndex);
              targetQuiz.blankStages ||= {};
              targetQuiz.blankStages[nextStageKey] = true;
              targetQuiz.stageComponents ||= {};
              targetQuiz.stageComponents[nextStageKey] = [];
              targetQuiz.hiddenElements ||= {};
              targetQuiz.hiddenElements[nextStageKey] = [];
              targetQuiz.flowDisconnected ||= [];
              if (!targetQuiz.flowDisconnected.includes(nextStageKey)) {
                targetQuiz.flowDisconnected.push(nextStageKey);
              }
              targetQuiz.manualStageCount = Math.min(totalStages, nextStageIndex + 1);
              state.adminStage = nextStageIndex;
              state.selectedComponentId = null;
              saveQuizzes();
              render();
            }
            if (action === "remove-question") removeQuestion(Number(element.dataset.q));
            if (action === "request-delete-question") requestDeleteQuestion(Number(element.dataset.question));
            if (action === "request-delete-stage") requestDeleteStage(element.dataset.stageKey, element.dataset.stageLabel);
            if (action === "cancel-delete-stage") {
              state.pendingDeleteStageKey = null;
              state.pendingDeleteStageLabel = "";
              render();
            }
            if (action === "confirm-delete-stage") {
              const confirmation = document.querySelector("[data-delete-stage-input]")?.value || "";
              if (confirmation === "EXCLUIR") removeStage(state.pendingDeleteStageKey);
            }
            if (action === "cancel-delete-question") {
              state.pendingDeleteQuestionIndex = null;
              render();
            }
            if (action === "confirm-delete-question") {
              const confirmation = document.querySelector("[data-delete-confirm-input]")?.value || "";
              if (confirmation === "EXCLUIR") removeQuestion(state.pendingDeleteQuestionIndex);
            }
            if (action === "add-option") addOption(Number(element.dataset.q));
            if (action === "remove-option") removeOption(Number(element.dataset.q), Number(element.dataset.o));
            if (action === "add-result") addResult();
            if (action === "remove-result") removeResult(Number(element.dataset.r));
            if (action === "select-result") {
              state.adminResultIndex = Number(element.dataset.resultIndex || 0);

            if (action === "add-component-option") addComponentOption(element.dataset.componentId);
            if (action === "remove-component-option") removeComponentOption(element.dataset.componentId, Number(element.dataset.optionIndex));
            if (action === "clear-stage-image") clearStageImage(element.dataset.componentId);
            if (action === "restore-stage-element") restoreStageElement(element.dataset.targetId);
            if (action === "move-custom-up") moveStageComponent(element.dataset.componentId, -1);
            if (action === "move-custom-down") moveStageComponent(element.dataset.componentId, 1);
            if (action === "locate-stage-element") locateStageElement(element.dataset.targetId);
            if (action === "select-custom-component") {
              const clickedEditableText = event.target.closest(".custom-text-content");
              if (!clickedEditableText && event.target.closest(".canvas-component-toolbar, .inline-video-editor, .inline-property-editor, .inline-timer-editor, input, textarea, select, [contenteditable='true']")) return;
              selectStageComponent(element.dataset.componentId);

            if (action === "select-stage-component-editor") {
              state.selectedComponentId = element.dataset.componentId;
              render();
            }
            if (action === "copy-link") copyLink(element);
            if (action === "open-public-link") openPublicLink(element);

                if (href && href !== "#") {

            if (action === "custom-button-go") {

            if (action === "clear-submissions") {

            }
            if (action === "choose-price-template") addPriceTemplate(element.dataset.template);

              render();

            if (action === "close-option-templates") {

              render();
            }
            if (action === "filter-option-templates") {

            }
            if (action === "choose-option-template") addOptionTemplate(element.dataset.template);
            if (action === "close-progress-templates") {
              state.progressTemplatePicker = false;
              render();

            if (action === "choose-progress-template") addProgressTemplate(element.dataset.template);
            if (action === "open-progress-templates") {
              state.progressTemplatePicker = true;
              render();
            }
            if (action === "save-quiz") {
              localStorage.setItem(accountStorageKey(STORAGE_KEY), JSON.stringify(state.quizzes));

              element.textContent = "Rascunho salvo";
              window.setTimeout(() => {
                element.disabled = false;
                element.textContent = "Salvar rascunho";
              }, 1200);
            }
            if (action === "publish-quiz") {
              const quizToPublish = activeQuiz();
              localStorage.setItem(accountStorageKey(STORAGE_KEY), JSON.stringify(state.quizzes));
              element.disabled = true;
              element.textContent = "Publicando...";
              syncQuizDefinition(quizToPublish).then(() => {
                state.unpublishedQuizIds.delete(quizToPublish.id);
                state.remoteError = "";
                render();
              }).catch(() => {
                element.disabled = false;
                element.textContent = "Tentar publicar novamente";
              });

            if (action === "component-pick") {
              addOrChooseComponent(element.dataset.component);

            if (action === "preview-start" && !isPublicPage) {
              state.adminStage = Math.min(1, quiz.questions.length);
              render();
            } else if (action === "preview-start" || action === "start-quiz") {
              setCurrentRunIgnored(quiz, false);
              state.previewStep = 0;
              state.answers = [];
              state.submittedThisRun = false;
              const introConnection = flowConnectionFor(quiz, "intro", null);
              if (!applyFlowTarget(quiz, introConnection?.to)) state.flowStage = "name";
              render();

            if (action === "preview-name-next" && !isPublicPage) {
              state.adminStage = Math.min(2, quiz.questions.length + 1);
              render();

              const nameInput = document.querySelector("[data-traveler-name]");
              const name = String(nameInput?.value || "").trim();
              if (!name) {
                nameInput?.focus();
                return;
              }
              state.lead = { ...state.lead, name };
              if (action === "name-next" && isTestName(name)) {
                setCurrentRunIgnored(quiz, true);
                removeCurrentFunnelRecord(quiz);
              } else if (action === "name-next") {
                setCurrentRunIgnored(quiz, false);
              }
              const nameConnection = flowConnectionFor(quiz, "name", null);
              if (!applyFlowTarget(quiz, nameConnection?.to)) {
                state.flowStage = "quiz";
                state.previewStep = 0;
              }
              state.answers = [];
              state.submittedThisRun = false;
              render();
            }
            if (action === "preview-answer" && !isPublicPage) {
              state.adminStage = Math.min(state.adminStage + 1, quiz.questions.length + 2);
              render();
            } else if (action === "preview-answer" || action === "answer") {
              const answeredStep = state.previewStep;
              const answerIndex = Number(element.dataset.answer);
              state.answers[answeredStep] = answerIndex;
              const from = `question:${answeredStep}`;
              const connection = flowConnectionFor(quiz, from, answerIndex) || flowConnectionFor(quiz, from, null);
              const shouldRecord = action === "answer" && !connection?.to?.startsWith("question:");
              // Se uma opção não tiver uma conexão no construtor, mantenha o
              // quiz utilizável avançando para a próxima pergunta normalmente.
              if (!applyFlowTarget(quiz, connection?.to, shouldRecord)) {
                if (answeredStep >= quiz.questions.length - 1) {
                  if (action === "answer") recordSubmission(quiz);
                  state.flowStage = "loading";
                  state.loadingProgress = 0;
                } else {
                  state.previewStep += 1;
                }
              }
              render();
            }
            if (action === "preview-reset" && !isPublicPage) {
              state.adminStage = 0;
              render();
            } else if (action === "preview-reset" || action === "reset-quiz") {
              state.flowStage = "intro";
              state.previewStep = 0;
              state.loadingProgress = 0;
              state.answers = [];
              state.submittedThisRun = false;
              state.lead = { name: "", email: "", phone: "" };

            node.classList.add("stage-drop-active");
          });
          node.addEventListener("dragleave", () => node.classList.remove("stage-drop-active"));
          node.addEventListener("drop", (event) => {
            const type = event.dataTransfer.getData("text/quiz-component");
            if (!type) return;
            event.preventDefault();
            event.stopPropagation();
            state.adminStage = Number(node.dataset.stageDrop || 0);
            addOrChooseComponent(type);
          });
        });

        document.querySelectorAll(".funnel-node-move-handle").forEach((handle) => {
          handle.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopPropagation();
            const wrapper = handle.closest("[data-flow-node]");
            const track = wrapper.closest(".funnel-node-track");
            const stage = Number(wrapper.dataset.flowNode);
            const startX = event.clientX;
            const startY = event.clientY;
            const startLeft = wrapper.offsetLeft;
            const startTop = wrapper.offsetTop;
            handle.setPointerCapture(event.pointerId);
            const move = (moveEvent) => {
              const zoom = state.mapZoom || 1;
              wrapper.style.left = `${Math.max(0, startLeft + (moveEvent.clientX - startX) / zoom)}px`;
              wrapper.style.top = `${Math.max(0, startTop + (moveEvent.clientY - startY) / zoom)}px`;
              renderFunnelConnections();
            };
            const end = () => {
              handle.removeEventListener("pointermove", move);
              handle.removeEventListener("pointerup", end);
              activeQuiz().flowLayout ||= {};
              activeQuiz().flowLayout[stageKey(activeQuiz(), stage)] = { x: wrapper.offsetLeft, y: wrapper.offsetTop };
              saveQuizzes();
            };
            handle.addEventListener("pointermove", move);
            handle.addEventListener("pointerup", end);
          });
        });

        document.querySelectorAll("[data-flow-output]").forEach((port) => {
          port.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopPropagation();
            const from = port.dataset.flowOutput;
            const option = port.dataset.flowOption === "" ? null : Number(port.dataset.flowOption);
            const existing = flowConnectionFor(activeQuiz(), from, option);
            const portRect = port.getBoundingClientRect();
            const start = { x: portRect.left + portRect.width / 2, y: portRect.top + portRect.height / 2 };
            let moved = false;
            const overlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            overlay.classList.add("connection-drag-overlay");
            overlay.setAttribute("viewBox", `0 0 ${window.innerWidth} ${window.innerHeight}`);
            const temporary = document.createElementNS("http://www.w3.org/2000/svg", "path");
            temporary.classList.add("temporary-connection");
            overlay.appendChild(temporary);
            document.body.appendChild(overlay);
            const compatibleInputs = [...document.querySelectorAll("[data-flow-input]")].filter((input) => {
              const rect = input.getBoundingClientRect();
              return rect.left + rect.width / 2 > start.x + 20 && input.dataset.flowInput !== from;
            });
            compatibleInputs.forEach((input) => input.classList.add("connection-target-available"));
            const targetAt = (x, y) => {
              const direct = document.elementFromPoint(x, y)?.closest("[data-flow-input]");
              if (direct && compatibleInputs.includes(direct)) return direct;
              return compatibleInputs
                .map((candidate) => {
                  const rect = candidate.getBoundingClientRect();
                  const centerX = rect.left + rect.width / 2;
                  const centerY = rect.top + rect.height / 2;
                  return { candidate, distance: Math.hypot(centerX - x, centerY - y) };
                })
                .filter((item) => item.distance <= 38)
                .sort((a, b) => a.distance - b.distance)[0]?.candidate || null;
            };
            const move = (moveEvent) => {
              if (moveEvent.pointerId !== event.pointerId) return;
              moved = true;
              const x = moveEvent.clientX;
              const y = moveEvent.clientY;
              temporary.setAttribute("d", `M ${start.x} ${start.y} L ${x} ${y}`);
            };
            const end = (upEvent) => {
              if (upEvent.pointerId !== event.pointerId) return;
              document.removeEventListener("pointermove", move, true);
              document.removeEventListener("pointerup", end, true);
              document.removeEventListener("pointercancel", cancel, true);
              overlay.remove();
              compatibleInputs.forEach((input) => input.classList.remove("connection-target-available"));
              const input = targetAt(upEvent.clientX, upEvent.clientY);
              if (input) {
                activeQuiz().flowConnections = (activeQuiz().flowConnections || []).filter((connection) => !(connection.from === from && (connection.option ?? null) === (option ?? null)));
                activeQuiz().flowConnections.push({ from, to: input.dataset.flowInput, option });
                activeQuiz().flowDisconnected = (activeQuiz().flowDisconnected || []).filter((key) => key !== from && key !== input.dataset.flowInput);
                saveQuizzes();
                render();
              } else if (!moved && existing) {
                showConnectionContextMenu(upEvent.clientX, upEvent.clientY, from, option);
              }
            };
            const cancel = (cancelEvent) => {
              if (cancelEvent.pointerId !== event.pointerId) return;
              document.removeEventListener("pointermove", move, true);
              document.removeEventListener("pointerup", end, true);
              document.removeEventListener("pointercancel", cancel, true);
              overlay.remove();
              compatibleInputs.forEach((input) => input.classList.remove("connection-target-available"));
            };
            document.addEventListener("pointermove", move, true);
            document.addEventListener("pointerup", end, true);
            document.addEventListener("pointercancel", cancel, true);
          });
        });

        const funnelMap = document.querySelector("[data-funnel-map]");
        if (funnelMap) {
          funnelMap.addEventListener("contextmenu", (event) => {
            if (event.target.closest(".funnel-node, button")) return;
            event.preventDefault();
            showFunnelContextMenu(event.clientX, event.clientY);
          });
          funnelMap.addEventListener("click", () => document.querySelector(".funnel-context-menu")?.remove());
        }

        const canvasDropZone = document.querySelector(".selected-outline");
        if (canvasDropZone) {
          canvasDropZone.addEventListener("dragover", (event) => {
            event.preventDefault();
            canvasDropZone.classList.add("drag-over");
          });
          canvasDropZone.addEventListener("dragleave", () => canvasDropZone.classList.remove("drag-over"));
          canvasDropZone.addEventListener("drop", (event) => {
            event.preventDefault();
            const type = event.dataTransfer.getData("text/quiz-component");
            canvasDropZone.classList.remove("drop-ready", "drag-over");
            if (type) addOrChooseComponent(type);
          });
        }

        const leadForm = document.querySelector("[data-lead-form]");
        if (leadForm) {
          leadForm.addEventListener("input", () => {
            state.lead = Object.fromEntries(new FormData(leadForm).entries());
          });
        }

        document.querySelectorAll("[data-capture-form]").forEach((captureForm) => {
          const syncCaptureFields = () => {
            captureForm.querySelectorAll("[data-capture-field]").forEach((input) => {
              state.lead[input.dataset.captureField] = input.value;
            });
          };
          captureForm.addEventListener("input", syncCaptureFields);
          captureForm.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!captureForm.reportValidity()) return;
            syncCaptureFields();
            const from = captureForm.dataset.flowStageKey || activeExperienceKey(quiz);
            const connection = flowConnectionFor(quiz, from, null);
            if (isPublicPage && connection?.to) {
              const shouldRecord = !connection.to.startsWith("question:");
              if (applyFlowTarget(quiz, connection.to, shouldRecord)) {
                render();
                return;
              }
            }
            captureForm.classList.add("saved");
            const button = captureForm.querySelector("button[type='submit']");
            if (!button) return;
            const originalLabel = button.textContent;
            button.textContent = "Dados salvos ✓";
            window.setTimeout(() => {
              if (!button.isConnected) return;
              button.textContent = originalLabel;
              captureForm.classList.remove("saved");
            }, 1600);
          });
        });
      }

      function showFunnelContextMenu(x, y) {
        document.querySelector(".funnel-context-menu")?.remove();
        const menu = document.createElement("div");
        menu.className = "funnel-context-menu";
        menu.style.left = `${x}px`;
        menu.style.top = `${y}px`;
        menu.innerHTML = `<strong>Adicionar ao funil</strong><button type="button">+ Nova pergunta</button>`;
        menu.querySelector("button").addEventListener("click", () => {
          menu.remove();
          addQuestion();
        });
        document.body.appendChild(menu);
      }

      function showConnectionContextMenu(x, y, from, option) {
        document.querySelector(".funnel-context-menu")?.remove();
        const menu = document.createElement("div");
        menu.className = "funnel-context-menu";
        menu.style.left = `${x}px`;
        menu.style.top = `${y}px`;
        menu.innerHTML = `<strong>Conexão</strong><button type="button">✂ Cortar conexão</button>`;
        menu.querySelector("button").addEventListener("click", () => {
          activeQuiz().flowConnections = (activeQuiz().flowConnections || []).filter((connection) => !(connection.from === from && (connection.option ?? null) === (option ?? null)));
          saveQuizzes();
          menu.remove();
          render();
        });
        document.body.appendChild(menu);
      }

      function startLoading() {
        if (loadingTimer) return;
        const quiz = getPublicQuiz() || activeQuiz();
        const durationMs = Math.max(1, Math.min(300, Number(quiz.loadingDuration) || 6)) * 1000;
        loadingStartedAt = performance.now() - (Math.max(0, Number(state.loadingProgress) || 0) / 100) * durationMs;

        const animate = (now) => {
          if (state.flowStage !== "loading") {
            loadingTimer = null;
            loadingStartedAt = 0;
            return;
          }

          const exactProgress = Math.min(100, ((now - loadingStartedAt) / durationMs) * 100);
          state.loadingProgress = exactProgress;
          const bar = document.querySelector(".loading-bar span");
          const number = document.querySelector(".loading-number");
          if (bar) bar.style.width = `${exactProgress}%`;
          if (number) number.textContent = `${Math.floor(exactProgress)}%`;

          if (exactProgress < 100) {
            loadingTimer = window.requestAnimationFrame(animate);
            return;
          }

          state.loadingProgress = 100;
          loadingTimer = null;
          loadingStartedAt = 0;
          const connection = flowConnectionFor(quiz, "loading", null);
          if (!applyFlowTarget(quiz, connection?.to)) state.flowStage = "result";
          render();
        };

        loadingTimer = window.requestAnimationFrame(animate);
      }

      function exportSubmissions(quiz) {
        const rows = quizSubmissions(quiz);
        const headers = ["data", "nome", "perfil", ...quiz.questions.map((_, index) => `pergunta_${index + 1}`)];
        const lines = [headers.join(",")].concat(rows.map((row) => {
          const values = [
            new Date(row.createdAt).toLocaleString("pt-BR"),
            row.travelerName || "",
            profileLabel(quiz, row.resultProfile),
            ...row.answers.map((answer, index) => quiz.questions[index]?.options[answer]?.text || "")
          ];
          return values.map((value) => `"${String(value).replace(/"/g, '""')}"`).join(",");
        }));
        const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${quiz.id}-respostas.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function icon(name) {
        return document.getElementById("icon-" + name)?.innerHTML || "";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#096;");
      }

      render();
      window.addEventListener("resize", fitAdminCanvas);
      window.addEventListener("storage", (event) => {
        const accountFunnelKey = accountStorageKey(FUNNEL_KEY);
        const accountSubmissionsKey = accountStorageKey(SUBMISSIONS_KEY);
        if (event.key === accountFunnelKey && event.newValue) {
          try {
            const incoming = JSON.parse(event.newValue);
            if (Array.isArray(incoming)) state.funnel = mergeFunnelRecords(state.funnel, incoming);
          } catch (error) {}
        }
        if (event.key === accountSubmissionsKey && event.newValue) {
          try {
            const incoming = JSON.parse(event.newValue);
            if (Array.isArray(incoming)) state.submissions = mergeUnique(state.submissions, incoming, "id");
          } catch (error) {}
        }
        if ((event.key === accountFunnelKey || event.key === accountSubmissionsKey) && adminRoute()) render();
      });
      window.addEventListener("focus", () => {
        if (!adminRoute()) return;
        if (state.adminTab === "flow") refreshRemoteFunnel();
        else {
          state.remoteLoaded = false;
          loadRemoteData();
        }
      });
      window.setInterval(() => {
        if (document.visibilityState === "visible" && adminRoute() && state.adminTab === "flow") {
          refreshRemoteFunnel();
        }
      }, 10000);
    </script>
  </body>
</html>
