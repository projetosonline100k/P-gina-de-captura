      function loadAuthSession() {
        try {
          const session = JSON.parse(localStorage.getItem(AUTH_SESSION_KEY) || "null");
          if (!session?.access_token || !session?.user?.email) return null;
          if (!ADMIN_EMAILS.includes(String(session.user.email).toLowerCase())) return null;
          if (session.expires_at && Number(session.expires_at) <= Date.now()) return null;
          return session;
        } catch {
          return null;
        }
      }

      function saveAuthSession(session) {
        if (!session) localStorage.removeItem(AUTH_SESSION_KEY);
        else localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(session));
        state.authSession = session;
      }

        const normalized = String(resolvedEmail || "").toLowerCase();
        return normalized === SECONDARY_ADMIN_EMAIL ? `${baseKey}:${SECONDARY_ADMIN_EMAIL}` : baseKey;
      }

        state.authLoading = true;
        state.authError = "";
        render();
        try {
          const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
            method: "POST",
            headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ email: String(email || "").trim().toLowerCase(), password })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.access_token) throw new Error(data.error_description || data.msg || "E-mail ou senha incorretos.");
          if (!ADMIN_EMAILS.includes(String(data.user?.email || "").toLowerCase())) throw new Error("Este e-mail não possui acesso ao dashboard.");
          saveAuthSession({ ...data, expires_at: Date.now() + Number(data.expires_in || 3600) * 1000 });
          switchAccountWorkspace(data.user.email);
          state.authLoading = false;
          state.authError = "";
          render();
        } catch (error) {
          state.authLoading = false;
          state.authError = /email not confirmed/i.test(error.message || "")

            : /invalid login|credentials/i.test(error.message || "")

              : (error.message || "Não foi possível entrar agora.");
          render();
        }
      }

      function sanitizeRichText(html) {
        const template = document.createElement("template");
        template.innerHTML = String(html || "");
        [...template.content.querySelectorAll("p, div")].forEach((element) => {
          const separator = document.createElement("br");
          const spacer = document.createElement("br");
          element.replaceWith(...element.childNodes, separator, spacer);
        });
        const allowedTags = new Set(["SPAN", "B", "STRONG", "I", "EM", "U", "BR", "UL", "OL", "LI"]);
        const allowedStyles = new Set(["color", "font-family", "font-size", "font-weight", "font-style", "text-decoration", "letter-spacing", "line-height"]);
        [...template.content.querySelectorAll("*")].forEach((element) => {
          if (!allowedTags.has(element.tagName)) {
            element.replaceWith(...element.childNodes);
            return;
          }
          const safeStyles = [];
          for (const property of allowedStyles) {
            const value = element.style.getPropertyValue(property);
            if (value && !/[<>{};]/.test(value)) safeStyles.push(`${property}:${value}`);
          }
          [...element.attributes].forEach((attribute) => element.removeAttribute(attribute.name));
          if (safeStyles.length) element.setAttribute("style", safeStyles.join(";"));
        });
        return template.innerHTML;
      }

      function saveQuizzes() {
        const editingQuiz = state.quizzes.find((quiz) => quiz.id === state.activeId);

        const currentSnapshot = JSON.stringify(state.quizzes);

          historyPast.push(lastQuizSnapshot);
          if (historyPast.length > 100) historyPast.shift();
          historyFuture = [];
          lastQuizSnapshot = currentSnapshot;
        }
        const undoButton = document.querySelector("[data-action='undo-editor']");
        const redoButton = document.querySelector("[data-action='redo-editor']");
        if (undoButton) undoButton.disabled = !historyPast.length;
        if (redoButton) redoButton.disabled = !historyFuture.length;
        localStorage.setItem(accountStorageKey(STORAGE_KEY), JSON.stringify(state.quizzes));
        const quizId = activeQuiz()?.id;
        if (quizId) {
          state.unpublishedQuizIds.add(quizId);

          if (publishButton) {
            publishButton.classList.add("has-changes");
            publishButton.textContent = "Publicar alterações";
          }
        }
      }

      function applyHistorySnapshot(snapshot) {
        historyApplying = true;
        state.quizzes = JSON.parse(snapshot).map(normalizeQuiz);
        if (!state.quizzes.some((quiz) => quiz.id === state.activeId)) state.activeId = state.quizzes[0]?.id || null;
        lastQuizSnapshot = JSON.stringify(state.quizzes);
        localStorage.setItem(accountStorageKey(STORAGE_KEY), lastQuizSnapshot);
        historyApplying = false;
        state.selectedComponentId = null;
        render();
      }

      function undoEditor() {
        if (!historyPast.length) return;
        const current = JSON.stringify(state.quizzes);
        const previous = historyPast.pop();
        historyFuture.push(current);
        applyHistorySnapshot(previous);
      }

      function redoEditor() {
        if (!historyFuture.length) return;
        const current = JSON.stringify(state.quizzes);
        const next = historyFuture.pop();
        historyPast.push(current);
        applyHistorySnapshot(next);
      }

          event.preventDefault();
          if (event.shiftKey) redoEditor();
          else undoEditor();
        });
      }

      function syncQuizDefinition(quiz) {
        const clean = normalizeQuiz(quiz);
        return supabaseRequest("quiz_definitions", {
          method: "POST",
          prefer: "resolution=merge-duplicates",
          body: {
            slug: slugFor(clean),
            quiz_id: clean.id,
            config: clean,
            updated_at: new Date().toISOString()
          }
        }).catch(() => syncQuizDefinitionFallback(clean));
      }

      async function syncQuizDefinitionFallback(quiz) {
        const slug = slugFor(quiz);
        const id = `quiz-definition:${slug}`;
        try {
          await supabaseRequest(`quiz_submissions?id=eq.${encodeURIComponent(id)}`, { method: "DELETE" });
          await supabaseRequest("quiz_submissions", {
            method: "POST",
            body: {
              id,
              quiz_id: quiz.id,
              created_at: new Date().toISOString(),
              traveler_name: "",
              answers: quiz,
              result_profile: "__quiz_definition__",
              result_title: slug
            }
          });
          state.remoteError = "";
        } catch (error) {
          console.warn("Não foi possível publicar a configuração do quiz:", error);
          state.remoteError = "O quiz foi salvo neste navegador, mas não foi possível publicá-lo online.";
          throw error;
        }
      }

      async function loadRemotePublicQuiz(slug) {
        if (!supabaseEnabled() || !slug || state.publicQuizLoads[slug]) return;
        state.publicQuizLoads[slug] = "loading";
        try {
          let remoteQuiz = null;
          try {
            const rows = await supabaseRequest(`quiz_definitions?slug=eq.${encodeURIComponent(slug)}&select=config&limit=1`);
            remoteQuiz = rows?.[0]?.config || null;
          } catch (error) {
            const fallbackRows = await supabaseRequest(`quiz_submissions?result_profile=eq.__quiz_definition__&result_title=eq.${encodeURIComponent(slug)}&select=answers&order=created_at.desc&limit=1`);
            remoteQuiz = fallbackRows?.[0]?.answers || null;
          }
          if (remoteQuiz) {
            const clean = normalizeQuiz(remoteQuiz);
            const index = state.quizzes.findIndex((quiz) => quiz.id === clean.id || slugFor(quiz) === slug);
            if (index >= 0) state.quizzes[index] = clean;
            else state.quizzes.push(clean);
          }
          state.publicQuizLoads[slug] = "loaded";
        } catch (error) {
          console.warn("Não foi possível carregar a versão publicada do quiz:", error);
          state.publicQuizLoads[slug] = "error";
        } finally {
          render();
        }
      }

      async function supabaseRequest(path, options = {}) {
        if (!supabaseEnabled()) return null;
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
          method: options.method || "GET",
          cache: "no-store",
          keepalive: Boolean(options.keepalive),
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            ...(options.prefer ? { Prefer: options.prefer } : {})
          },
          body: options.body ? JSON.stringify(options.body) : undefined
        });
        if (!response.ok) {
          const detail = await response.text();
          throw new Error(detail || `Supabase retornou ${response.status}`);
        }
        if (response.status === 204) return null;
        const responseText = await response.text();
        if (!responseText.trim()) return null;
        try {
          return JSON.parse(responseText);
        } catch (error) {
          console.warn("O Supabase respondeu sem JSON válido:", responseText);
          return responseText;
        }
      }

      function mergeUnique(localItems, remoteItems, key) {
        const map = new Map();
        [...localItems, ...remoteItems].forEach((item) => map.set(item[key], item));
        return [...map.values()];
      }

      function mergeFunnelRecords(localItems, remoteItems) {
        const map = new Map();
        [...localItems, ...remoteItems].forEach((item) => {
          const current = map.get(item.sessionId);
          if (!current) {
            map.set(item.sessionId, item);
            return;
          }
          const currentRank = Number(current.maxRank || 0);
          const nextRank = Number(item.maxRank || 0);
          const currentTime = new Date(current.updatedAt || current.createdAt || 0).getTime();
          const nextTime = new Date(item.updatedAt || item.createdAt || 0).getTime();
          map.set(item.sessionId, nextRank > currentRank || (nextRank === currentRank && nextTime >= currentTime) ? item : current);
        });
        return [...map.values()];
      }

      async function loadAllRemoteFunnelRows() {
        const pageSize = 1000;
        const rows = [];
        for (let offset = 0; offset < 50000; offset += pageSize) {
          const page = await supabaseRequest(
            `quiz_funnel?select=*&order=updated_at.desc&limit=${pageSize}&offset=${offset}`
          );
          if (!Array.isArray(page)) break;
          rows.push(...page);
          if (page.length < pageSize) break;
        }
        return rows;
      }

      async function loadRemoteData() {
        if (!supabaseEnabled() || state.remoteLoading || state.remoteLoaded) return;
        state.remoteLoading = true;
        try {
          const [submissionRows, funnelRows] = await Promise.all([
            supabaseRequest("quiz_submissions?select=*&order=created_at.asc"),
            loadAllRemoteFunnelRows()
          ]);
          const accountQuizIds = new Set(state.quizzes.map((quiz) => quiz.id));
          const remoteSubmissions = (submissionRows || [])
            .filter((row) => row.result_profile !== "__quiz_definition__" && accountQuizIds.has(row.quiz_id))
            .map(remoteSubmission);
          const remoteFunnelRecords = (funnelRows || []).filter((row) => accountQuizIds.has(row.quiz_id)).map(remoteFunnel);
          state.submissions = mergeUnique(state.submissions, remoteSubmissions, "id");
          state.funnel = mergeFunnelRecords(state.funnel, remoteFunnelRecords);
          state.remoteLoaded = true;
          state.remoteError = "";
          saveSubmissions();
          saveFunnel();
        } catch (error) {
          console.warn("Supabase ainda nao esta pronto:", error);
          state.remoteError = "Supabase ainda não conectado. Confira as tabelas e políticas.";
        } finally {
          state.remoteLoading = false;
          render();
        }
      }

      async function refreshRemoteFunnel() {
        if (!supabaseEnabled() || state.funnelRefreshing) return;
        state.funnelRefreshing = true;
        try {
          const rows = await loadAllRemoteFunnelRows();
          state.funnel = mergeFunnelRecords(state.funnel, (rows || []).map(remoteFunnel));
          saveFunnel();
          state.remoteError = "";
        } catch (error) {
          console.warn("Não foi possível atualizar o funil:", error);
          state.remoteError = "Não foi possível atualizar o funil agora.";
        } finally {
          state.funnelRefreshing = false;
          if (adminRoute() && state.adminTab === "flow") render();
        }
      }

      function syncSubmission(submission) {
        supabaseRequest("quiz_submissions", {
          method: "POST",
          prefer: "resolution=merge-duplicates",
          body: submissionPayload(submission)
        }).catch((error) => {
          console.warn("Nao foi possivel salvar resposta no Supabase:", error);
          if (String(error.message || error).includes("traveler_name")) {
            supabaseRequest("quiz_submissions", {
              method: "POST",
              prefer: "resolution=merge-duplicates",
              body: submissionPayloadWithoutName(submission)
            }).catch((fallbackError) => {
              console.warn("Nao foi possivel salvar resposta sem nome no Supabase:", fallbackError);
            });
            state.remoteError = "Respostas salvas sem nome. Falta criar a coluna traveler_name no Supabase.";
            return;
          }
          state.remoteError = "Resposta salva localmente. Supabase ainda não conectado.";
        });
      }

      function syncFunnel(record, keepalive = false) {
        return supabaseRequest("quiz_funnel", {
          method: "POST",
          prefer: "resolution=merge-duplicates",
          keepalive,
          body: funnelPayload(record)
        }).catch((error) => {
          console.warn("Nao foi possivel salvar funil no Supabase:", error);
          state.remoteError = "Funil salvo localmente. Supabase ainda não conectado.";
        });
      }

      function deleteRemoteQuizData(quizId) {
        Promise.all([
          supabaseRequest(`quiz_submissions?quiz_id=eq.${encodeURIComponent(quizId)}`, { method: "DELETE" }),
          supabaseRequest(`quiz_funnel?quiz_id=eq.${encodeURIComponent(quizId)}`, { method: "DELETE" })
        ]).catch((error) => {
          console.warn("Nao foi possivel limpar dados no Supabase:", error);
          state.remoteError = "Dados locais limpos. Supabase não conseguiu limpar remoto.";
        });
      }

      function uid(prefix = "quiz") {
        return prefix + "-" + Math.random().toString(36).slice(2, 8);
      }

      function encodeQuiz(quiz) {
        const json = JSON.stringify(quiz);
        return btoa(unescape(encodeURIComponent(json)))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      }

      function decodeQuiz(payload) {
        const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
        return JSON.parse(decodeURIComponent(escape(atob(padded))));
      }

      function shareUrl(quiz) {
        const url = new URL("/", PUBLIC_SITE_ORIGIN);
        url.searchParams.set("quiz", slugFor(quiz));
        url.searchParams.set("v", APP_BUILD_VERSION);
        return url.toString();
      }

      function previewUrl() {
        const quiz = activeQuiz();
        const url = new URL("/", window.location.origin);
        try {
          localStorage.setItem(PREVIEW_DRAFT_KEY, JSON.stringify(quiz));
        } catch (error) {
          console.warn("Não foi possível salvar o rascunho da prévia:", error);
        }
        url.searchParams.set("preview", "1");
        url.searchParams.set("quiz", slugFor(quiz));
        url.searchParams.set("v", APP_BUILD_VERSION);
        return url.toString();
      }

      function getPublicQuiz() {
        const params = new URLSearchParams(window.location.search);
        const encoded = params.get("q");
        if (params.get("preview") === "1") {
          const previewSlug = params.get("quiz");
          try {
            const draft = JSON.parse(localStorage.getItem(PREVIEW_DRAFT_KEY) || "null");
            if (draft && slugFor(draft) === previewSlug) return normalizeQuiz(draft);
          } catch (error) {
            console.warn("Não foi possível carregar o rascunho da prévia:", error);
          }
          const previewQuiz = state.quizzes.find((quiz) => slugFor(quiz) === previewSlug) || activeQuiz();
          return normalizeQuiz(previewQuiz);
        }
        if (!encoded) {
          const slug = params.get("quiz");
          if (!slug) return null;
          return normalizeQuiz(state.quizzes.find((quiz) => slugFor(quiz) === slug) || null);
        }
        try {
          const embeddedQuiz = normalizeQuiz(decodeQuiz(encoded));
          const embeddedSlug = slugFor(embeddedQuiz);
          const remoteQuiz = state.publicQuizLoads[embeddedSlug] === "loaded"
            ? state.quizzes.find((quiz) => slugFor(quiz) === embeddedSlug)
            : null;
          return normalizeQuiz(remoteQuiz || embeddedQuiz);
        } catch (error) {
          return null;
        }
      }

      function normalizeQuiz(quiz) {
        const clean = clone(quiz || defaultQuiz);
        clean.slug = clean.slug || slugify(clean.title || clean.id || "quiz");
        clean.questions = (clean.questions || []).filter(Boolean);
        clean.results = (clean.results || []).filter(Boolean);
        if (clean.id === defaultQuiz.id) {
          const lockedResult = clean.results.find((result) => result.profile === "travado")
            || clone(defaultQuiz.results[0]);
          lockedResult.profile = "travado";
          lockedResult.title = "Viajante Travado";
          clean.results = [lockedResult];
        }
        clean.questions.forEach((question) => {
          question.options = (question.options || []).filter(Boolean);
        });
        if (!clean.questions.length) clean.questions = clone(defaultQuiz.questions);
        if (!clean.results.length) clean.results = clone(defaultQuiz.results);
        clean.stageComponents = clean.stageComponents || {};
        clean.hiddenElements = clean.hiddenElements || {};
        clean.blankStages = clean.blankStages || {};
        clean.removedStages = Array.isArray(clean.removedStages) ? clean.removedStages : [];
        clean.status = ["active", "paused", "draft", "archived"].includes(clean.status) ? clean.status : "active";
        clean.updatedAt = clean.updatedAt || new Date().toISOString();
        clean.loadingDuration = Math.max(1, Math.min(300, Number(clean.loadingDuration) || 6));
        if (!Array.isArray(clean.flowConnections)) clean.flowConnections = [];
        Object.values(clean.stageComponents).flat().forEach((component) => {
          if (component?.type === "Timer") {
            component.action = "show";
            component.showCountdown = false;
            component.behaviorVersion = 2;
          }
          if (component?.type === "Botão" && typeof component.countsAsCheckout !== "boolean") {
            component.countsAsCheckout = Boolean(component.url && component.url !== "#");
          }
          if (component?.type === "Botão") {
            component.destination ||= "url";
            component.backgroundColor ||= "#19a64f";
            component.textColor ||= "#ffffff";
            component.fontFamily ||= "Inter";
            component.fontSize ||= "22";
            component.fontWeight ||= "800";
            component.borderRadius ||= "14";
            component.buttonWidth ||= "100";
            component.buttonAlign ||= "center";
            component.effect ||= "shadow";
          }
          if (component?.type === "Preço" && component.template === "comparison") {
            if (typeof component.basicCountsAsCheckout !== "boolean") {
              component.basicCountsAsCheckout = Boolean(component.basicButtonUrl && component.basicButtonUrl !== "#");
            }
            if (typeof component.premiumCountsAsCheckout !== "boolean") {
              component.premiumCountsAsCheckout = Boolean(component.premiumButtonUrl && component.premiumButtonUrl !== "#");
            }
          }
        });
        return clean;
      }

      function imageFileData(file) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type.startsWith("image/")) {
            reject(new Error("Escolha um arquivo de imagem válido."));
            return;
          }
          if (file.size > 10 * 1024 * 1024) {
            reject(new Error("A imagem deve ter no máximo 10 MB."));
            return;
          }
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("Não foi possível ler essa imagem."));
          reader.onload = () => {
            const source = String(reader.result || "");
            const image = new Image();
            image.onerror = () => reject(new Error("O arquivo selecionado não pôde ser aberto como imagem."));
            image.onload = () => {
              const maxDimension = 1800;
              const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
              canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
              const context = canvas.getContext("2d");
              if (!context) {
                resolve(source);
                return;
              }
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/webp", 0.86));
            };
            image.src = source;
          };
          reader.readAsDataURL(file);
        });
      }

      function reorderStageComponent(draggedId, targetId) {
        if (!draggedId || !targetId || draggedId === targetId) return;
        flushPendingComponentEdits();
        const quiz = activeQuiz();
        const components = quiz.stageComponents?.[stageKey(quiz)] || [];
        const from = components.findIndex((item) => item.id === draggedId);
        const to = components.findIndex((item) => item.id === targetId);
        if (from < 0 || to < 0) return;
        if (state.previewDevice === "mobile") {
          const ordered = components.slice().sort((a, b) => Number(a.mobileOrder ?? components.indexOf(a)) - Number(b.mobileOrder ?? components.indexOf(b)));
          const orderedFrom = ordered.findIndex((item) => item.id === draggedId);
          const orderedTo = ordered.findIndex((item) => item.id === targetId);
          const [component] = ordered.splice(orderedFrom, 1);
          ordered.splice(orderedTo, 0, component);
          ordered.forEach((item, index) => { item.mobileOrder = index; });
        } else {
          const [component] = components.splice(from, 1);
          components.splice(to, 0, component);
        }
        saveQuizzes();
        refreshAdminCanvas();
      }

      function removeQuestion(index) {
        const quiz = activeQuiz();
        if (quiz.questions.length === 1) return;
        const remapKey = (key) => {
          const match = String(key || "").match(/^question:(\d+)$/);
          if (!match) return key;
          const questionIndex = Number(match[1]);
          if (questionIndex === index) return null;
          return questionIndex > index ? `question:${questionIndex - 1}` : key;
        };
        const remapRecord = (record = {}) => Object.fromEntries(Object.entries(record).flatMap(([key, value]) => {
          const nextKey = remapKey(key);
          return nextKey ? [[nextKey, value]] : [];
        }));
        quiz.flowConnections = (quiz.flowConnections || []).flatMap((connection) => {
          const from = remapKey(connection.from);
          const to = remapKey(connection.to);
          return from && to ? [{ ...connection, from, to }] : [];
        });
        quiz.flowDisconnected = (quiz.flowDisconnected || []).map(remapKey).filter(Boolean);
        quiz.flowLayout = remapRecord(quiz.flowLayout);
        quiz.stageComponents = remapRecord(quiz.stageComponents);
        quiz.hiddenElements = remapRecord(quiz.hiddenElements);
        quiz.questions.splice(index, 1);
        state.adminStage = Math.min(index + 2, quiz.questions.length + 1);
        state.previewStep = Math.min(state.previewStep, quiz.questions.length - 1);
        state.pendingDeleteQuestionIndex = null;
        saveQuizzes();
        render();
      }

        quiz.stageComponents ||= {};
        const copiedComponents = clone(quiz.stageComponents[`question:${index}`] || []);
        const componentIds = new Map(copiedComponents.map((component) => [component.id, uid("component")]));

          ...component,
          id: componentIds.get(component.id),
          targetIds: (component.targetIds || []).map((target) => target.startsWith("component:")
            ? `component:${componentIds.get(target.slice(10)) || target.slice(10)}`
            : target)
        }));
        const sourceConnections = (quiz.flowConnections || []).filter((connection) => connection.from === `question:${index}`);
        sourceConnections.forEach((connection) => quiz.flowConnections.push({ ...connection, from: `question:${newIndex}` }));
        quiz.flowLayout ||= {};
        const sourcePosition = nodePosition(quiz, index + 1);
        quiz.flowLayout[`question:${newIndex}`] = { x: sourcePosition.x + 380, y: sourcePosition.y + 180 };
        state.adminStage = newIndex + 2;
        saveQuizzes();
        render();
      }

      function addOption(questionIndex) {
        const quiz = activeQuiz();
        quiz.questions[questionIndex].options.push({
          text: "Nova opcao",
          profile: "planejador",
          weight: 1
        });
        const from = `question:${questionIndex}`;
        const example = (quiz.flowConnections || []).find((connection) => connection.from === from);
        if (example) quiz.flowConnections.push({ from, to: example.to, option: quiz.questions[questionIndex].options.length - 1 });
        saveQuizzes();
        render();
      }

      function removeOption(questionIndex, optionIndex) {
        const quiz = activeQuiz();
        const options = quiz.questions[questionIndex].options;
        if (options.length === 1) return;
        options.splice(optionIndex, 1);
        const from = `question:${questionIndex}`;
        quiz.flowConnections = (quiz.flowConnections || [])
          .filter((connection) => !(connection.from === from && connection.option === optionIndex))
          .map((connection) => connection.from === from && Number(connection.option) > optionIndex ? { ...connection, option: connection.option - 1 } : connection);
        saveQuizzes();
        render();
      }

      function updateOption(questionIndex, optionIndex, key, value) {
        const option = activeQuiz().questions[questionIndex].options[optionIndex];
        option[key] = key === "weight" ? Number(value || 0) : value;
        saveQuizzes();
        render();
      }

      function addResult() {
        activeQuiz().results.push({
          profile: "novo",
          title: "Novo resultado",
          text: "Explique aqui a recomendacao personalizada.",
          bullets: ["Primeiro beneficio", "Segundo beneficio"]
        });
        saveQuizzes();
        render();
      }

      function removeResult(index) {
        const results = activeQuiz().results;
        if (results.length === 1) return;
        results.splice(index, 1);
        saveQuizzes();
        render();
      }

      function resultFor(quiz, answers) {
        const scores = {};
        answers.forEach((answer, index) => {
          const option = quiz.questions[index]?.options[answer];
          if (!option) return;
          scores[option.profile] = (scores[option.profile] || 0) + Number(option.weight || 1);
        });
        const best = Object.entries(scores).sort((a, b) => b[1] - a[1])[0]?.[0];
        return quiz.results.find((result) => result.profile === best) || quiz.results[0];
      }

      function recordSubmission(quiz) {
        if (state.submittedThisRun) return;
        if (isTestName(state.lead.name)) return;
        const result = resultFor(quiz, state.answers);
        const submission = {
          id: uid("resposta"),
          quizId: quiz.id,
          createdAt: new Date().toISOString(),
          travelerName: state.lead.name || "",
          answers: state.answers.slice(0, quiz.questions.length),
          resultProfile: result.profile,
          resultTitle: result.title
        };
        state.submissions.push(submission);
        state.submittedThisRun = true;
        saveSubmissions();
        syncSubmission(submission);
      }

      function visitorSessionId() {
        let id = sessionStorage.getItem("quizlab_session_id");
        if (!id) {
          id = uid("sessao");
          sessionStorage.setItem("quizlab_session_id", id);
        }
        return id;
      }

      function currentFunnelSessionId(quiz) {
        return `${visitorSessionId()}:${quiz.id}`;
      }

      function ignoredSessionKey(quiz) {
        return `quizlab_ignore_tracking_${quiz.id}`;
      }

      function isCurrentRunIgnored(quiz) {
        return sessionStorage.getItem(ignoredSessionKey(quiz)) === "1";
      }

      function setCurrentRunIgnored(quiz, ignored) {
        if (ignored) sessionStorage.setItem(ignoredSessionKey(quiz), "1");
        else sessionStorage.removeItem(ignoredSessionKey(quiz));
      }

      function normalizeName(value) {
        return String(value || "")
          .trim()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function isTestName(value) {
        return normalizeName(value).includes("teste");
      }

      function funnelSteps(quiz) {
        return [
          { key: "visit", label: "Abertura", rank: 0 },
          { key: "start", label: "Começou", rank: 1 },
          { key: "name", label: "Nome", rank: 2 },
          ...quiz.questions.map((_, index) => ({
            key: `question-${index + 1}`,
            label: `Pergunta ${index + 1}`,
            rank: index + 3
          })),
          { key: "loading", label: "Loading", rank: quiz.questions.length + 3 },
          { key: "result", label: "Resultado", rank: quiz.questions.length + 4 },
          { key: "checkout", label: "Clique checkout", rank: quiz.questions.length + 5 }
        ];
      }

      function currentFunnelStep(quiz) {
        if (state.flowStage === "name") return { key: "name", rank: 2 };
        if (state.flowStage === "quiz") {
          return funnelSteps(quiz)[Math.min(state.previewStep + 3, quiz.questions.length + 2)];
        }
        if (state.flowStage === "loading") return { key: "loading", rank: quiz.questions.length + 3 };
        if (state.flowStage === "result") return { key: "result", rank: quiz.questions.length + 4 };
        return { key: "visit", rank: 0 };
      }

      function recordFunnelStep(quiz, step) {
        if (adminRoute()) return;
        if (isCurrentRunIgnored(quiz)) return;
        const sessionId = currentFunnelSessionId(quiz);
        let record = state.funnel.find((item) => item.sessionId === sessionId && item.quizId === quiz.id);
        let changed = false;
        if (!record) {
          record = {
            sessionId,
            quizId: quiz.id,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            maxRank: 0,
            stage: "visit"
          };
          state.funnel.push(record);
          changed = true;
        }
        if (step.rank > Number(record.maxRank || 0)) {
          record.maxRank = step.rank;
          record.stage = step.key;
          changed = true;
        }
        if (changed) {
          record.updatedAt = new Date().toISOString();
          saveFunnel();
          syncFunnel(record);
        }
      }

      function recordFunnelProgress(quiz) {
        recordFunnelStep(quiz, currentFunnelStep(quiz));
      }

      function recordCheckoutClick(quiz) {
        recordFunnelStep(quiz, { key: "checkout", rank: quiz.questions.length + 5 });
        if (adminRoute()) return Promise.resolve();
        const now = new Date().toISOString();
        const clickRecord = {
          sessionId: `${currentFunnelSessionId(quiz)}:checkout-click:${uid("click")}`,
          quizId: quiz.id,
          createdAt: now,
          updatedAt: now,
          maxRank: quiz.questions.length + 5,
          stage: "checkout-click"
        };
        state.funnel.push(clickRecord);
        saveFunnel();
        return syncFunnel(clickRecord, true);
      }

      function removeCurrentFunnelRecord(quiz) {
        const sessionId = currentFunnelSessionId(quiz);
        state.funnel = state.funnel.filter((item) => item.sessionId !== sessionId);
        saveFunnel();
        supabaseRequest(`quiz_funnel?session_id=eq.${encodeURIComponent(sessionId)}`, { method: "DELETE" })
          .catch((error) => console.warn("Nao foi possivel remover funil de teste:", error));
      }

      async function publishCurrentLink() {
        const quiz = activeQuiz();
        if (!quiz) throw new Error("Quiz não encontrado");
        localStorage.setItem(accountStorageKey(STORAGE_KEY), JSON.stringify(state.quizzes));
        await syncQuizDefinition(quiz);
        state.unpublishedQuizIds.delete(quiz.id);
        state.remoteError = "";
        return shareUrl(quiz);
      }

      async function copyLink(trigger) {
        const link = shareUrl(activeQuiz());
        const originalLabel = trigger?.textContent;
        if (trigger) {
          trigger.disabled = true;
          trigger.textContent = "Atualizando…";
        }
        try {
          const publicLink = await publishCurrentLink();
          await navigator.clipboard?.writeText(publicLink);
          if (trigger) trigger.textContent = "Link copiado ✓";
        } catch (error) {
          if (trigger) trigger.textContent = "Tentar novamente";
          state.remoteError = "Não foi possível atualizar o link público agora.";
        } finally {
          if (trigger) window.setTimeout(() => {
            if (!trigger.isConnected) return;
            trigger.disabled = false;
            trigger.textContent = originalLabel || "Copiar";
          }, 1600);
        }
        const field = document.querySelector("[data-share-link]");
        if (field) field.select();
      }

      async function openPublicLink(trigger) {
        const target = window.open("about:blank", "_blank");
        const originalLabel = trigger?.textContent;
        if (trigger) {
          trigger.disabled = true;
          trigger.textContent = "Atualizando…";
        }
        try {
          const publicLink = await publishCurrentLink();
          if (target) target.location.href = publicLink;
          else window.location.href = publicLink;
        } catch (error) {
          target?.close();
          state.remoteError = "Não foi possível atualizar o link público agora.";
          if (trigger) {
            trigger.disabled = false;
            trigger.textContent = originalLabel || "Abrir link";
          }
          render();
        }
      }

      function adminRoute() {
        const params = new URLSearchParams(window.location.search);
        return params.get("admin") === "1" || (!params.has("q") && !params.has("quiz") && params.get("preview") !== "1");
      }

      function render() {
        bindKeyboardShortcuts();
        if (adminRoute() && !state.authSession) {
          document.getElementById("app").innerHTML = loginView();
          bindLoginEvents();
          return;
        }
        const previousScroll = {
          window: window.scrollY,
          canvas: document.querySelector(".canvas-area")?.scrollTop || 0,
          components: document.querySelector(".component-sidebar")?.scrollTop || 0,
          settings: document.querySelector(".settings-scroll")?.scrollTop || 0
        };
        const routeParams = new URLSearchParams(window.location.search);
        const routeQuiz = getPublicQuiz();
        const publicSlug = routeParams.get("quiz") || (routeParams.has("q") && routeQuiz ? slugFor(routeQuiz) : "");
        if (publicSlug && !adminRoute() && !routeParams.has("preview")) {
          loadRemotePublicQuiz(publicSlug);
        }
        const publicQuiz = getPublicQuiz();
        const isPublic = publicQuiz && !adminRoute();
        const publicScrollKey = isPublic
          ? `${publicQuiz.id}:${state.flowStage}:${state.flowStage === "quiz" ? state.previewStep : ""}`
          : "";
        const shouldScrollTop = isPublic && publicScrollKey !== lastPublicScrollKey;
        if (isPublic) recordFunnelProgress(publicQuiz);
        if (!isPublic && !state.remoteError) loadRemoteData();
        document.getElementById("app").innerHTML = isPublic
          ? publicView(publicQuiz)
          : dashboardView();
        if (isPublic) {
          applyHiddenStageElements(publicQuiz, activeExperienceKey(publicQuiz));
        } else if (state.adminTab === "builder" && state.builderView === "page") {
          const frame = document.querySelector(".selected-outline");
          applyHiddenStageElements(activeQuiz(), stageKey(activeQuiz()), frame || document);
          if (frame) decorateRemovableStageElements(frame);
        } else if (state.adminTab === "builder" && state.builderView === "flow") {
          syncFlowThumbnails(activeQuiz());
        }
        bindEvents(isPublic ? publicQuiz : activeQuiz());
        if (isPublic) {
          lastPublicScrollKey = publicScrollKey;
          if (shouldScrollTop) {
            window.requestAnimationFrame(() => window.scrollTo({ top: 0, left: 0, behavior: "auto" }));
          }
        } else {
          lastPublicScrollKey = "";
          fitAdminCanvas();
          renderFunnelConnections();
          window.requestAnimationFrame(() => {
            window.scrollTo({ top: previousScroll.window, left: 0, behavior: "auto" });
            const canvas = document.querySelector(".canvas-area");
            const components = document.querySelector(".component-sidebar");
            const settings = document.querySelector(".settings-scroll");
            if (canvas) canvas.scrollTop = previousScroll.canvas;
            if (components) components.scrollTop = previousScroll.components;
            if (settings) settings.scrollTop = previousScroll.settings;
          });
        }
      }

      function renderFunnelConnections() {
        window.requestAnimationFrame(() => {
          const layer = document.querySelector("[data-connection-layer]");
          const track = layer?.closest(".funnel-node-track");
          if (!layer || !track) return;
          const quiz = activeQuiz();
          layer.setAttribute("viewBox", `0 0 ${track.scrollWidth} ${track.scrollHeight}`);
          const pointInTrack = (element) => {
            let x = element.offsetLeft + element.offsetWidth / 2;
            let y = element.offsetTop + element.offsetHeight / 2;
            let parent = element.offsetParent;
            while (parent && parent !== track) {
              x += parent.offsetLeft;
              y += parent.offsetTop;
              parent = parent.offsetParent;
            }
            return { x, y };
          };
          layer.innerHTML = (quiz.flowConnections || []).map((connection) => {
            const output = [...track.querySelectorAll("[data-flow-output]")].find((item) => item.dataset.flowOutput === connection.from && (item.dataset.flowOption === "" ? null : Number(item.dataset.flowOption)) === (connection.option ?? null));
            const input = [...track.querySelectorAll("[data-flow-input]")].find((item) => item.dataset.flowInput === connection.to);
            if (!output || !input) return "";
            const start = pointInTrack(output);
            const end = pointInTrack(input);
            const x1 = start.x;
            const y1 = start.y;
            const x2 = end.x;
            const y2 = end.y;
            return `<path data-connection-from="${escapeAttr(connection.from)}" data-connection-option="${connection.option ?? ""}" d="M ${x1} ${y1} L ${x2} ${y2}"></path>`;
          }).join("");
          layer.querySelectorAll("[data-connection-from]").forEach((path) => {
            path.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              const option = path.dataset.connectionOption === "" ? null : Number(path.dataset.connectionOption);
              showConnectionContextMenu(event.clientX, event.clientY, path.dataset.connectionFrom, option);
            });
          });
        });
      }

      function syncFlowThumbnails(quiz) {
        document.querySelectorAll("[data-thumbnail-stage]").forEach((thumbnail) => {
          const stage = Number(thumbnail.dataset.thumbnailStage);
          applyHiddenStageElements(quiz, stageKey(quiz, stage), thumbnail);
          thumbnail.querySelectorAll(".canvas-component-toolbar, .inline-video-editor, .inline-property-editor, .inline-timer-editor").forEach((element) => element.remove());
          thumbnail.querySelectorAll(".selected-custom-component").forEach((element) => element.classList.remove("selected-custom-component"));
        });
      }

      function fitAdminCanvas() {
        window.requestAnimationFrame(() => {
          const frame = document.querySelector(".selected-outline");
          const page = frame?.querySelector(".canvas-live-page");
          if (!frame || !page) return;
          const isMobile = state.previewDevice === "mobile";
          const targetWidth = isMobile ? 390 : 1040;
          page.style.width = `${targetWidth}px`;
          const availableWidth = Math.max(320, frame.clientWidth - 4);
          page.style.zoom = String(Math.min(1, availableWidth / targetWidth));
        });
      }

      function setPreviewDevice(device) {
        state.previewDevice = device === "mobile" ? "mobile" : "desktop";
        render();
      }

      function refreshAdminCanvas() {
        if (adminRoute() && state.adminTab === "builder") {
          const frame = document.querySelector(".selected-outline");
          if (frame) {
            frame.innerHTML = adminCanvasPreview(activeQuiz());
            applyHiddenStageElements(activeQuiz(), stageKey(activeQuiz()), frame);
            decorateRemovableStageElements(frame);
            bindRefreshedAdminPreview(frame);
            bindRefreshedCanvasEditing(frame);
            fitAdminCanvas();
          }
        }
      }

      function bindRefreshedAdminPreview(frame) {
        frame.querySelectorAll("[data-action]").forEach((element) => {
          element.addEventListener("click", (event) => {
            const action = element.dataset.action;
            if (action) event.preventDefault();
            if (action) event.stopPropagation();
            if (action === "preview-answer") {
              selectQuestionOption(Math.max(0, state.adminStage - 2), Number(element.dataset.answer));
              return;
            }
            if (action?.startsWith("preview-")) return;
            if (action === "select-custom-component") {
              const clickedEditableText = event.target.closest(".custom-text-content");
              if (!clickedEditableText && event.target.closest(".canvas-component-toolbar, .inline-video-editor, .inline-property-editor, .inline-timer-editor, input, textarea, select, [contenteditable='true']")) return;
              selectStageComponent(element.dataset.componentId);
              return;
            }
            if (action === "remove-stage-component") removeStageComponent(element.dataset.componentId);
            if (action === "add-component-option") addComponentOption(element.dataset.componentId);
            if (action === "remove-component-option") removeComponentOption(element.dataset.componentId, Number(element.dataset.optionIndex));
            if (action === "clear-stage-image") clearStageImage(element.dataset.componentId);
            if (action === "restore-stage-element") restoreStageElement(element.dataset.targetId);
            if (action === "move-custom-up") moveStageComponent(element.dataset.componentId, -1);
            if (action === "move-custom-down") moveStageComponent(element.dataset.componentId, 1);
            if (action === "locate-stage-element") {
              locateStageElement(element.dataset.targetId);
              return;
            }
            if (!["remove-stage-component", "clear-stage-image", "move-custom-up", "move-custom-down", "select-custom-component", "locate-stage-element"].includes(action)) render();
          });
        });
      }

      function bindRefreshedCanvasEditing(root) {
        root.querySelectorAll("[data-inline-component]").forEach((input) => {
          input.addEventListener("input", () => {
            const components = activeQuiz().stageComponents?.[stageKey(activeQuiz())] || [];
            const component = components.find((item) => item.id === input.dataset.inlineComponent);
            if (!component) return;
            component[input.dataset.componentKey] = input.matches("textarea, input, select")
              ? input.value
              : (input.classList.contains("price-feature-copy") ? input.innerText : input.textContent);
            if (input.classList.contains("custom-text-content")) {
              component.content = input.innerText;
              component.richHtml = sanitizeRichText(input.innerHTML);
            }
            saveQuizzes();
          });
          if (input.matches("textarea, input, select")) input.addEventListener("change", refreshAdminCanvas);
          input.addEventListener("click", (event) => {
            if (!input.classList.contains("custom-text-content")) {
              event.stopPropagation();
              return;
            }
            event.preventDefault();
            event.stopPropagation();
            selectStageComponent(input.dataset.inlineComponent);
          });
          if (input.classList.contains("custom-text-content")) {
            input.addEventListener("mouseup", () => rememberTextSelection(input));
            input.addEventListener("keyup", () => rememberTextSelection(input));
          }
        });
        root.querySelectorAll("[data-image-upload]").forEach((input) => {
          input.addEventListener("change", () => uploadStageImage(input));
          input.addEventListener("click", (event) => event.stopPropagation());
        });
        root.querySelectorAll("[data-timer-target]").forEach((input) => {
          input.addEventListener("change", () => {
            const timer = (activeQuiz().stageComponents?.[stageKey(activeQuiz())] || []).find((item) => item.id === input.dataset.timerTarget);
            if (!timer) return;
            timer.targetIds ||= [];
            if (input.checked && !timer.targetIds.includes(input.value)) timer.targetIds.push(input.value);
            if (!input.checked) timer.targetIds = timer.targetIds.filter((id) => id !== input.value);
            const card = input.closest(".visibility-item");
            card?.classList.toggle("delayed", input.checked);
            card?.classList.toggle("immediate", !input.checked);
            const status = card?.querySelector("em");
            if (status) status.textContent = input.checked ? "Aparece após o timer" : "Aparece imediatamente";
            saveQuizzes();
          });
        });
        root.querySelectorAll("[data-locate-target]").forEach((card) => {
          card.addEventListener("mouseenter", () => locateStageElement(card.dataset.locateTarget, true));
          card.addEventListener("mouseleave", () => {
            root.querySelector(`[data-delay-target="${CSS.escape(card.dataset.locateTarget)}"]`)?.classList.remove("located-stage-element");
          });
        });
        root.querySelectorAll("[data-timer-countdown]").forEach((input) => {
          input.addEventListener("change", () => {
            const timer = (activeQuiz().stageComponents?.[stageKey(activeQuiz())] || []).find((item) => item.id === input.dataset.timerCountdown);
            if (!timer) return;
            timer.showCountdown = input.checked;
            saveQuizzes();
          });
        });
        root.querySelectorAll("[data-custom-draggable]").forEach((component) => {
          component.addEventListener("dragstart", (event) => {
            if (event.target.closest("textarea, input, [contenteditable='true']")) return event.preventDefault();
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/custom-component-id", component.dataset.customDraggable);
            component.classList.add("is-dragging-component");
          });
          component.addEventListener("dragend", () => component.classList.remove("is-dragging-component"));
          component.addEventListener("dragover", (event) => {
            if (!event.dataTransfer.types.includes("text/custom-component-id")) return;
            event.preventDefault();
            event.stopPropagation();
            component.classList.add("component-drop-target");
          });
          component.addEventListener("dragleave", () => component.classList.remove("component-drop-target"));
          component.addEventListener("drop", (event) => {
            const draggedId = event.dataTransfer.getData("text/custom-component-id");
            if (!draggedId) return;
            event.preventDefault();
            event.stopPropagation();
            reorderStageComponent(draggedId, component.dataset.customDraggable);
          });
        });
        root.querySelectorAll("[data-component-position]").forEach((zone) => {
          zone.addEventListener("dragover", (event) => {
            if (!event.dataTransfer.types.includes("text/custom-component-id")) return;
            event.preventDefault();
            event.stopPropagation();
            zone.classList.add("position-drop-active");
          });
          zone.addEventListener("dragleave", () => zone.classList.remove("position-drop-active"));
          zone.addEventListener("drop", (event) => {
            const id = event.dataTransfer.getData("text/custom-component-id");
            if (!id) return;
            event.preventDefault();
            event.stopPropagation();
            setStageComponentPosition(id, zone.dataset.componentPosition);
          });
        });
      }

      function dashboardView() {
        const quiz = activeQuiz();
        if (!quiz) {
          state.adminTab = "home";
          return adminShell(null, "", homeView(null));
        }
        const link = shareUrl(quiz);
        if (state.adminTab === "home") return adminShell(quiz, link, homeView(quiz));
        if (state.adminTab === "flow") return adminShell(quiz, link, flowView(quiz));
        if (state.adminTab === "leads") return adminShell(quiz, link, leadsView(quiz));
        if (state.adminTab === "design") return adminShell(quiz, link, designView(quiz));
        if (state.adminTab === "settings") return adminShell(quiz, link, settingsView(quiz, link));
        const defaultStageNames = [
          "Boas-vindas",
          "Nome",
          ...quiz.questions.map((_, index) => `Pergunta ${index + 1}`),
          "Loading",
          "Resultado"
        ];
        const stageNames = defaultStageNames.map((name, stage) => {
          const key = stageKey(quiz, stage);
          return quiz.blankStages?.[key] ? `Bloco ${stage + 1}` : name;
        });
        const activeStage = Math.min(state.adminStage, stageNames.length - 1);
        const componentNames = componentCatalog();
        if (state.builderView === "flow") return adminShell(quiz, link, flowBuilderCanvas(quiz, stageNames));
        return adminShell(quiz, link, pageBuilderCanvas(quiz, link, stageNames, activeStage, componentNames));
      }

      function componentCatalog() {
        return [
          ["❞", "Depoimentos"],
          ["▭", "Botão"],
          ["▣", "Captura"],
          ["↕", "Espaço"],
          ["◫", "Gráficos"],
          ["▧", "Imagem"],
          ["○", "Loading"],
          ["☑", "Opções"],
          ["▰", "Progresso"],
          ["$", "Preço"],
          ["T", "Texto"],
          ["◷", "Timer"],
          ["▣", "Vídeo"],
          ["</>", "Script"]
        ];
      }

      function flowBuilderCanvas(quiz, stageNames) {
        quiz.flowLayout ||= {};
        quiz.flowDisconnected ||= [];
        const manualFlow = quiz.manualStageCount != null;
        const visibleStageCount = manualFlow
          ? Math.max(0, Math.min(stageNames.length, Number(quiz.manualStageCount) || 0))
          : stageNames.length;
        const visibleStages = stageNames
          .map((name, stage) => ({ name, stage, key: stageKey(quiz, stage) }))
          .slice(0, visibleStageCount)
          .filter((item) => !(quiz.removedStages || []).includes(item.key));
        if (!manualFlow) ensureFlowConnections(quiz);
        return `
          <div class="flow-builder-workspace">
            <div class="funnel-map" data-funnel-map>
              <div class="funnel-map-hint">Conecte da saída à direita para a entrada à esquerda · clique em uma etapa para editar</div>
              <button class="funnel-create-block" type="button" data-action="${manualFlow && visibleStageCount < stageNames.length ? "add-manual-stage" : "add-question"}">+ Criar novo bloco</button>
              <div class="funnel-map-controls">
                <button data-action="map-zoom-out" title="Diminuir zoom">−</button>
                <strong>${Math.round(state.mapZoom * 100)}%</strong>
                <button data-action="map-zoom-in" title="Aumentar zoom">+</button>
                <button data-action="map-zoom-reset" title="Restaurar zoom">Ajustar</button>
              </div>
              <div class="funnel-node-track" style="--map-zoom:${state.mapZoom}">
                <svg class="funnel-connection-layer" data-connection-layer aria-hidden="true"></svg>
                ${visibleStages.map((item, displayIndex) => `
                  <div class="funnel-node-wrap" data-flow-node="${item.stage}" style="left:${nodePosition(quiz, item.stage).x}px;top:${nodePosition(quiz, item.stage).y}px">
                    <button class="flow-port flow-input-port" data-flow-input="${escapeAttr(item.key)}" title="Entrada desta etapa"></button>
                    <article class="funnel-node ${item.stage === state.adminStage ? "active" : ""}" data-stage-drop="${item.stage}" data-stage="${item.stage}">
                      <div class="funnel-node-head"><span>${displayIndex + 1}</span><strong>${escapeHtml(item.name)}</strong><div class="funnel-node-tools">${item.stage > 1 && item.stage <= quiz.questions.length + 1 ? `<button data-action="move-question-order" data-question="${item.stage - 2}" data-direction="-1" title="Mover pergunta para trás">←</button><button data-action="move-question-order" data-question="${item.stage - 2}" data-direction="1" title="Mover pergunta para frente">→</button><button data-action="duplicate-question-page" data-question="${item.stage - 2}" title="Duplicar página">⧉</button>` : ""}<button class="delete-flow-node" data-action="request-delete-stage" data-stage-key="${escapeAttr(item.key)}" data-stage-label="${escapeAttr(item.name)}" title="Excluir bloco">×</button><button class="funnel-node-move-handle" title="Mover página">⠿</button></div></div>
                      <div class="funnel-node-preview">${stageThumbnail(quiz, item.stage)}</div>
                      <div class="funnel-node-foot"><span>${(quiz.stageComponents?.[item.key] || []).length} componentes</span><button data-action="open-stage-editor" data-stage="${item.stage}">Editar página</button></div>
                    </article>
                    <div class="flow-output-ports">${stageOutputPorts(quiz, item.stage)}</div>
                  </div>
                `).join("")}
                ${visibleStages.length ? "" : `<div class="empty-flow-canvas"><span>＋</span><strong>Seu fluxo está vazio</strong><p>Clique em “Criar novo bloco” para começar.</p></div>`}
              </div>
            </div>
          </div>
        `;
      }

      function ensureFlowConnections(quiz) {
        const keys = ["intro", "name", ...quiz.questions.map((_, index) => `question:${index}`), "loading", "result"].filter((key) => !(quiz.removedStages || []).includes(key));
        if (!Array.isArray(quiz.flowConnections)) quiz.flowConnections = [];
        if (!quiz.flowConnections.length) {
          quiz.flowConnections = keys.slice(0, -1).flatMap((from, index) => {
            if (!from.startsWith("question:")) return [{ from, to: keys[index + 1], option: null }];
            const questionIndex = Number(from.split(":")[1]);
            return quiz.questions[questionIndex].options.map((_, option) => ({ from, to: keys[index + 1], option }));
          }).filter((connection) => !(quiz.flowDisconnected || []).includes(connection.from) && !(quiz.flowDisconnected || []).includes(connection.to));
          return;
        }
        quiz.flowConnections = quiz.flowConnections.filter((connection) => connection.from !== "result" && connection.to !== "publication");
        const introConnection = quiz.flowConnections.find((connection) => connection.from === "intro" && connection.option == null);
        if (!introConnection || introConnection.to !== "name") {
          const previousTarget = introConnection?.to || "question:0";
          if (introConnection) introConnection.to = "name";
          else quiz.flowConnections.push({ from: "intro", to: "name", option: null });
          if (!quiz.flowConnections.some((connection) => connection.from === "name")) {
            quiz.flowConnections.push({ from: "name", to: previousTarget, option: null });
          }
        } else if (!quiz.flowConnections.some((connection) => connection.from === "name")) {
          quiz.flowConnections.push({ from: "name", to: "question:0", option: null });
        }
        const genericQuestionConnections = quiz.flowConnections.filter((connection) => connection.from.startsWith("question:") && connection.option == null);
        genericQuestionConnections.forEach((generic) => {
          const questionIndex = Number(generic.from.split(":")[1]);
          quiz.flowConnections = quiz.flowConnections.filter((connection) => connection !== generic);
          quiz.questions[questionIndex]?.options.forEach((_, option) => quiz.flowConnections.push({ from: generic.from, to: generic.to, option }));
        });
      }

      function stageOutputPorts(quiz, stage) {
        const from = stageKey(quiz, stage);
        if (from.startsWith("question:")) {
          const questionIndex = Number(from.split(":")[1]);
          const options = quiz.questions[questionIndex]?.options || [];
          if (options.length) {
            return options.map((option, index) => `
              <button class="flow-port flow-output-port ${flowConnectionFor(quiz, from, index) ? "connected" : ""}" data-flow-output="${escapeAttr(from)}" data-flow-option="${index}" title="Resposta ${index + 1}: ${escapeAttr(option.text)}"><span>${index + 1}</span></button>
            `).join("");
          }
        }
        return `<button class="flow-port flow-output-port ${flowConnectionFor(quiz, from, null) ? "connected" : ""}" data-flow-output="${escapeAttr(from)}" data-flow-option="" title="Puxar conexão"></button>`;
      }

      function flowConnectionFor(quiz, from, option) {
        return (quiz.flowConnections || []).find((connection) => connection.from === from && (connection.option ?? null) === (option ?? null));
      }

      function applyFlowTarget(quiz, target, shouldRecordSubmission = false) {
        if (!target) return false;
        if (target.startsWith("question:")) {
          state.flowStage = "quiz";
          state.previewStep = Math.max(0, Math.min(quiz.questions.length - 1, Number(target.split(":")[1])));
          return true;
        }
        if (target === "loading") {
          if (shouldRecordSubmission) recordSubmission(quiz);
          state.flowStage = "loading";
          state.loadingProgress = 0;
          return true;
        }
        if (target === "result" || target === "publication") {
          if (shouldRecordSubmission) recordSubmission(quiz);
          state.flowStage = "result";
          return true;
        }
        if (target === "intro") {
          state.flowStage = "intro";
          return true;
        }
        if (target === "name") {
          state.flowStage = "name";
          return true;
        }
        return false;
      }

      function nodePosition(quiz, index) {
        const key = stageKey(quiz, index);
        return quiz.flowLayout?.[key] || { x: 50 + index * 400, y: index % 2 ? 260 : 40 };
      }

      function stageThumbnail(quiz, stage) {
        const key = stageKey(quiz, stage);
        let page = "";
        if (quiz.blankStages?.[key]) page = blankStageView(quiz, key, true);
        else if (stage === 0) page = introView(quiz, true);
        else if (stage === 1) page = nameView(quiz, true);
        else if (stage > 1 && stage <= quiz.questions.length + 1) page = questionView(quiz, stage - 2, true);
        else if (stage === quiz.questions.length + 2) page = loadingView(quiz, true);
        else page = resultView(quiz, quiz.results[0] || defaultQuiz.results[0], true);
        return `<div class="funnel-page-preview" data-thumbnail-stage="${stage}"><div class="funnel-page-preview-inner public-shell">${page}</div></div>`;
      }

      function pageBuilderCanvas(quiz, link, stageNames, activeStage, componentNames) {
        return `
            <div class="page-editor-switcher">
              <button data-action="select-builder-view" data-builder-view="flow">← Voltar ao mapa do funil</button>
              <strong>Editando: ${escapeHtml(stageNames[activeStage])}</strong>
            </div>
            <div class="builder-body">
              <aside class="component-sidebar">
                <button class="back-link">‹ voltar</button>
                <div class="component-list">
                  ${componentNames.map(([iconValue, name]) => `

                </div>

              </section>

              <aside class="settings-panel">
                ${selectedComponentSettingsMarkup(quiz, activeStage) || `<div class="settings-scroll"><div class="settings-group">${adminSettingsPanel(quiz, activeStage, link)}</div></div>`}
              </aside>
            </div>
        `;
      }

      function adminShell(quiz, link, content) {

        const libraryMode = state.adminTab === "home";
        return `
          <main class="admin-builder">

              <div class="builder-history">
                ${libraryMode ? `<strong class="library-brand">QuizLab</strong>` : `<button data-action="select-admin-tab" data-tab="home" aria-label="Voltar para meus quizzes">‹</button><button data-action="undo-editor" aria-label="Desfazer" title="Desfazer (Ctrl/Cmd + Z)" ${historyPast.length ? "" : "disabled"}>↶</button><button data-action="redo-editor" aria-label="Refazer" title="Refazer (Ctrl/Cmd + Shift + Z)" ${historyFuture.length ? "" : "disabled"}>↷</button>`}
              </div>

              <nav class="builder-tabs" aria-label="Seções do editor">

                  <button class="tool-icon ${state.previewDevice === "mobile" ? "active" : ""}" type="button" data-action="set-preview-device" data-device="mobile" aria-label="Visualizar no celular" title="Celular">▯</button>

              </div>
            </header>
            ${remoteStatusView()}
            ${content}

          </main>
        `;
      }

      function remoteStatusView() {
        if (!supabaseEnabled()) return "";
        if (state.remoteLoading) return `<div class="remote-status loading">Conectando ao Supabase...</div>`;
        if (state.remoteError) return `<div class="remote-status error">${escapeHtml(state.remoteError)}</div>`;
        if (state.remoteLoaded) return `<div class="remote-status online">Supabase conectado. Respostas e funil serão salvos online.</div>`;
        return "";
      }

      function adminCanvasPreview(quiz) {
        const stage = Math.min(state.adminStage, quiz.questions.length + 3);
        const key = stageKey(quiz, stage);
        if (quiz.blankStages?.[key]) {
          return `<div class="canvas-live-page public-shell">${blankStageView(quiz, key, true)}</div>`;
        }
        if (stage === 1) {
          return `<div class="canvas-live-page public-shell">${nameView(quiz, true)}</div>`;
        }
        if (stage > 1 && stage <= quiz.questions.length + 1) {
          return `
            <div class="canvas-live-page public-shell">
              ${questionView(quiz, stage - 2, true)}
            </div>
          `;
        }

        if (stage === quiz.questions.length + 2) {
          return `
            <div class="canvas-live-page public-shell">
              ${loadingView(quiz, true)}
            </div>
          `;
        }

        if (stage === quiz.questions.length + 3) {
          const activeResultIndex = Math.min(state.adminResultIndex, quiz.results.length - 1);
          const result = quiz.results[activeResultIndex] || defaultQuiz.results[0];
          return `
            <div class="canvas-live-page public-shell">
              ${resultView(quiz, result, true)}
            </div>
          `;
        }

        return `
          <div class="canvas-live-page public-shell">
            ${introView(quiz, true)}
          </div>
        `;
      }

      function adminSettingsPanel(quiz, stage, link) {
        const currentKey = stageKey(quiz, stage);
        if (quiz.blankStages?.[currentKey]) {
          return `
            <h3>Bloco vazio</h3>
            <p class="settings-note">Este bloco não possui configuração ou conteúdo padrão. Adicione apenas os componentes que quiser usar.</p>
          `;
        }

        if (stage === 0) {
          return `
            <h3>Boas-vindas</h3>
            ${textInput("Título", "title", quiz.title)}
            ${textareaInput("Subtítulo", "subtitle", quiz.subtitle)}
            <div class="field-row">
              ${textInput("Selo", "badge", quiz.badge)}
              ${textInput("Botão", "ctaLabel", quiz.ctaLabel)}
            </div>
            <label class="field">
              <span>Cor principal</span>
              <input type="color" value="${quiz.theme}" data-field="theme">
            </label>
          `;
        }

        if (stage === 1) {
          return `
            <h3>Identificação</h3>
            <p class="settings-note">Esta é a etapa em que o viajante informa o nome antes de começar o quiz.</p>
          `;
        }

        if (stage > 1 && stage <= quiz.questions.length + 1) {
          const questionIndex = stage - 2;
          return `
            <div class="section-title compact">
              <h3>Pergunta ${questionIndex + 1}</h3>
              <button type="button" class="secondary-btn" data-action="add-question">+ pergunta</button>
            </div>
            ${questionEditor(quiz.questions[questionIndex], questionIndex)}
          `;
        }

        if (stage === quiz.questions.length + 2) {
          return `
            <h3>Loading</h3>
            <label class="field">
              <span>Texto superior</span>
              <input value="Preparando seu diagnóstico" readonly>
            </label>
            <label class="field">
              <span>Tempo até trocar de página (segundos)</span>
              <input type="number" min="1" max="300" step="0.5" value="${escapeAttr(quiz.loadingDuration || 6)}" data-field="loadingDuration">
            </label>
            <p class="settings-note">A barra avança suavemente de 0% a 100% durante esse tempo e depois abre o resultado.</p>
          `;
        }

        if (stage === quiz.questions.length + 3) {
          const activeResultIndex = Math.min(state.adminResultIndex, quiz.results.length - 1);
          return `
            <div class="section-title compact">
              <h3>Resultados</h3>
              <button type="button" class="secondary-btn" data-action="add-result">+ resultado</button>
            </div>
            ${quiz.results.length > 1 ? `
              <div class="component-chip-list">
                ${quiz.results.map((item, index) => `
                  <button type="button" class="component-chip ${index === activeResultIndex ? "active" : ""}" data-action="select-result" data-result-index="${index}">${escapeHtml(item.title || item.profile || `Resultado ${index + 1}`)}</button>
                `).join("")}
              </div>
            ` : ""}
            <div class="stack">
              ${quiz.results[activeResultIndex] ? resultEditor(quiz.results[activeResultIndex], activeResultIndex) : ""}
            </div>
          `;
        }

        return `
          <h3>Publicação</h3>
          <label class="field"><span>Nome do link permanente</span><input value="${escapeAttr(slugFor(quiz))}" data-field="slug" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
          ${textInput("Link de compra ou WhatsApp", "purchaseUrl", quiz.purchaseUrl)}
          <div class="copy-row">
            <input readonly value="${escapeAttr(link)}" data-share-link>
            <button type="button" class="icon-btn" data-action="copy-link" aria-label="Copiar link">${icon("copy")}</button>
          </div>
          <a class="primary-btn full" href="${escapeAttr(link)}" target="_blank" rel="noopener">Abrir link do usuário</a>
        `;
      }

      function captureToggle(component, key, title, description) {

      function updateComponentOption(componentId, index, key, value) {

      function captureComponentEditor(component) {

      function buttonDestinationOptions(quiz, selectedValue) {

      }

      function responsiveComponentKey(key) {
        return state.previewDevice === "mobile" ? `mobile${key.charAt(0).toUpperCase()}${key.slice(1)}` : key;
      }

      function responsiveComponentValue(component, key, fallback = "") {
        const responsiveKey = responsiveComponentKey(key);
        return component[responsiveKey] ?? component[key] ?? fallback;
      }

      function buttonComponentEditor(quiz, component) {
        const destination = component.destination || "url";
        const visual = (key, fallback) => responsiveComponentValue(component, key, fallback);
        const visualKey = (key) => responsiveComponentKey(key);
        return `
          <div class="button-component-editor">
            <label class="field"><span>Texto do botão</span><input value="${escapeAttr(component.content || "Quero continuar")}" data-stage-component="${component.id}" data-component-key="content"></label>
            <label class="field"><span>Ao clicar, ir para</span><select data-stage-component="${component.id}" data-component-key="destination">
              <option value="url" ${destination === "url" ? "selected" : ""}>Link externo</option>

            ${destination === "url" ? `<label class="field"><span>Link do botão</span><input type="url" placeholder="https://..." value="${escapeAttr(component.url || "")}" data-stage-component="${component.id}" data-component-key="url"></label>` : `<p class="button-destination-note">No quiz publicado, este botão levará diretamente para ${escapeHtml(destination)}.</p>`}
            <div class="device-specific-note"><strong>${state.previewDevice === "mobile" ? "Celular" : "Computador"}</strong><span>Estas alterações valem somente para este dispositivo.</span></div>
            <h4 class="component-editor-subtitle">Aparência</h4>
            <div class="field-row">
              <label class="field"><span>Cor do botão</span><input type="color" value="${escapeAttr(visual("backgroundColor", "#19a64f"))}" data-stage-component="${component.id}" data-component-key="${visualKey("backgroundColor")}"></label>
              <label class="field"><span>Cor do texto</span><input type="color" value="${escapeAttr(visual("textColor", "#ffffff"))}" data-stage-component="${component.id}" data-component-key="${visualKey("textColor")}"></label>

            <label class="field"><span>Fonte</span><select data-stage-component="${component.id}" data-component-key="${visualKey("fontFamily")}">
              ${["Inter", "Playfair Display", "Georgia", "Arial", "system-ui"].map((font) => `<option value="${font}" ${visual("fontFamily", "Inter") === font ? "selected" : ""}>${font}</option>`).join("")}
            </select></label>
            <div class="field-row">
              <label class="field"><span>Tamanho</span><input type="number" min="12" max="60" value="${escapeAttr(visual("fontSize", "22"))}" data-stage-component="${component.id}" data-component-key="${visualKey("fontSize")}"></label>
              <label class="field"><span>Peso</span><select data-stage-component="${component.id}" data-component-key="${visualKey("fontWeight")}">
                ${[["400", "Normal"], ["600", "Seminegrito"], ["700", "Negrito"], ["800", "Extra negrito"], ["900", "Máximo"]].map(([value, label]) => `<option value="${value}" ${visual("fontWeight", "800") === value ? "selected" : ""}>${label}</option>`).join("")}
              </select></label>
            </div>
            <div class="field-row">
              <label class="field"><span>Cantos arredondados</span><input type="number" min="0" max="60" value="${escapeAttr(visual("borderRadius", "14"))}" data-stage-component="${component.id}" data-component-key="${visualKey("borderRadius")}"></label>
              <label class="field"><span>Largura (%)</span><input type="number" min="20" max="100" value="${escapeAttr(visual("buttonWidth", "100"))}" data-stage-component="${component.id}" data-component-key="${visualKey("buttonWidth")}"></label>
            </div>
            <div class="field-row">
              <label class="field"><span>Alinhamento</span><select data-stage-component="${component.id}" data-component-key="${visualKey("buttonAlign")}">
                <option value="left" ${visual("buttonAlign", "center") === "left" ? "selected" : ""}>Esquerda</option><option value="center" ${visual("buttonAlign", "center") === "center" ? "selected" : ""}>Centro</option><option value="right" ${visual("buttonAlign", "center") === "right" ? "selected" : ""}>Direita</option>
              </select></label>
              <label class="field"><span>Efeito</span><select data-stage-component="${component.id}" data-component-key="${visualKey("effect")}">
                ${[["none", "Nenhum"], ["shadow", "Sombra"], ["glow", "Brilho"], ["pulse", "Pulsar"], ["lift", "Elevar ao passar"]].map(([value, label]) => `<option value="${value}" ${visual("effect", "shadow") === value ? "selected" : ""}>${label}</option>`).join("")}
